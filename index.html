<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08120f">
<title>Monopolex</title>
<style>
:root{
  --bg0:#071013; --ink:#eaf3f1; --ink2:#aec3bf; --line:rgba(255,255,255,.15);
  --glass:rgba(255,255,255,.075); --solid:rgba(20,34,40,.95);
  --accent:#e9b872; --sea:#6fd1c3; --danger:#f59a8f; --ok:#9be3a5;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 70% at 0% 0%,#14363d 0%,transparent 58%),
    radial-gradient(90% 60% at 100% 100%,#2b2314 0%,transparent 55%),
    var(--bg0);
  color:var(--ink);font:15px/1.35 var(--sans);overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
h2{margin:0;font:600 19px/1.2 var(--serif)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Glass ---------- */
.glass{
  position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.17),0 10px 28px rgba(0,0,0,.35);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,0) 36%)}
.glass>*{position:relative;z-index:1}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:var(--solid)}
}
.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--solid);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.lite .glass::before{display:none}
.lite .tk-sh{filter:none}

/* ---------- Layout ---------- */
.app{position:fixed;inset:0;display:grid;gap:8px;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px);
  grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"players" "stage" "dock"}
.players{grid-area:players;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stage{grid-area:stage;position:relative;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--line);
  background:#0a171b;touch-action:none;contain:layout paint;min-height:0;outline-offset:-3px}
.dock{grid-area:dock;padding:12px;display:grid;gap:10px}
@media (orientation:landscape) and (min-width:640px){
  .app{grid-template-columns:minmax(0,1fr) clamp(300px,25vw,380px);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"stage players" "stage dock"}
  .players{grid-template-columns:1fr 1fr}
  .dock{align-self:end;padding:12px 12px 10px}
  .dock-msg{min-height:4.6em}
  .dock-actions{grid-template-columns:minmax(0,1fr)}
  .dock-actions .btn{width:100%}
}
@media (orientation:landscape) and (min-width:640px) and (min-height:620px){
  .players{grid-template-columns:1fr}
}

/* ---------- Player chips ---------- */
.chip{padding:7px 8px;display:flex;align-items:center;gap:7px;border-radius:var(--r-md);min-width:0;transition:border-color .2s,background .2s}
.chip .av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pc);color:#10171a;display:grid;place-items:center;font:700 13px var(--serif);border:2px solid rgba(255,255,255,.8)}
.chip .cm{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.chip .nm{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cash{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:5.4em}
.chip .meta{display:none;font-size:11px;color:var(--ink2)}
.chip .tag{position:absolute;top:-8px;right:6px;z-index:2;padding:1px 7px;border-radius:999px;background:var(--accent);color:#1a1306;font-size:10.5px;font-weight:700;display:none}
.chip.active{border-color:var(--accent);background:rgba(233,184,114,.14);box-shadow:0 0 0 1px var(--accent),inset 0 1px 0 rgba(255,255,255,.2)}
.chip.active .tag{display:block}
.chip.out{opacity:.55;border-style:dashed}
.chip.out .tag{display:block;background:var(--danger)}
.chip .delta{position:absolute;left:10px;bottom:-14px;font-weight:700;font-size:12px;opacity:0;pointer-events:none;z-index:3;text-shadow:0 1px 4px #000;font-variant-numeric:tabular-nums}
.chip .delta.up{color:var(--ok)} .chip .delta.down{color:var(--danger)}
.chip .cm{flex:1}
.chip .cash{min-width:0;white-space:nowrap}
@media (min-width:640px) and (orientation:landscape){.chip .nm{font-size:13px}.chip{padding:9px 10px}}
@media (min-width:640px) and (orientation:landscape) and (min-height:620px){.chip .meta{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media (min-width:640px) and (orientation:landscape) and (max-height:619px){.chip{padding:6px 7px}.chip .av{width:22px;height:22px}}

/* ---------- Board ---------- */
#world{position:absolute;left:0;top:0;width:968px;height:968px;transform-origin:0 0;will-change:transform}
.board{position:absolute;inset:0;border-radius:26px;
  background:radial-gradient(70% 70% at 50% 45%,#14272d 0%,#0b171b 70%);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.center{position:absolute;left:88px;top:88px;width:792px;height:792px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;
  border-radius:22px;background:linear-gradient(160deg,rgba(111,209,195,.07),rgba(233,184,114,.05));border:1px solid rgba(255,255,255,.07)}
.cell{position:absolute;width:88px;height:88px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:10px;overflow:hidden;cursor:pointer;
  -webkit-user-select:none;user-select:none}
.cell .nm{font:600 11.5px/1.15 var(--serif)}
.cell .pr{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell .gl{font:600 24px/1 var(--serif);color:var(--accent)}
.cell .band{position:absolute;background:var(--gc)}
.edge-b{padding-top:22px}.edge-b .band{left:0;right:0;top:0;height:16px}
.edge-t{padding-bottom:22px}.edge-t .band{left:0;right:0;bottom:0;height:16px}
.edge-l{padding-right:22px}.edge-l .band{top:0;bottom:0;right:0;width:16px}
.edge-r{padding-left:22px}.edge-r .band{top:0;bottom:0;left:0;width:16px}
.cell.corner .nm{font-size:13px}
.own{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--pc);color:#10171a;font:700 11px/16px var(--serif);text-align:center;border:2px solid rgba(255,255,255,.85)}
.edge-b .own,.edge-r .own{right:4px;bottom:4px}.edge-t .own{right:4px;top:4px}.edge-l .own{left:4px;bottom:4px}
.cell.hot::after{content:"";position:absolute;inset:2px;border:2px solid var(--accent);border-radius:9px;animation:pulse 1.1s ease-out 3;pointer-events:none}
.cell.hot{background:rgba(233,184,114,.16)}
@keyframes pulse{0%{opacity:1;transform:scale(.94)}100%{opacity:.15;transform:scale(1.02)}}
.token{position:absolute;left:-15px;top:-15px;width:30px;height:30px;pointer-events:none;will-change:transform}
.tk{position:absolute;inset:0;border-radius:50%;background:var(--pc);color:#10171a;font:700 14px/26px var(--serif);text-align:center;
  border:2px solid rgba(255,255,255,.88);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 -4px 6px rgba(0,0,0,.18),inset 0 3px 4px rgba(255,255,255,.35)}
.tk-sh{position:absolute;left:5px;right:5px;bottom:-5px;height:8px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px)}
.token.mine .tk{outline:2px solid #fff;outline-offset:2px}

.bld{position:absolute;top:3px;left:5px;font-size:10px;font-weight:700;color:var(--accent);letter-spacing:1px;pointer-events:none}
.cell.mort{opacity:.45;filter:saturate(.3)}
.pill{white-space:nowrap}
/* ---------- Stage overlays ---------- */
.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 20px);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px;text-align:center;opacity:0;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-top{display:flex;align-items:center;gap:12px}
.dock-top .dock-msg{flex:1;min-width:0}
.dice{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;pointer-events:none;opacity:.4;transition:opacity .22s}
.dice.show{opacity:1}
.dice-row{display:flex;gap:8px}
.die{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#fdfaf2,#d9d3c3);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 -2px 3px rgba(0,0,0,.12)}
.pip{width:6px;height:6px;border-radius:50%;background:#1a2326;opacity:0;place-self:center}.pip.on{opacity:1}
.dsum{font:700 12.5px/1.2 var(--sans);font-variant-numeric:tabular-nums;text-align:center;min-height:1.2em;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.dice.show .dsum{color:var(--ink)}
.ctrl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;pointer-events:none}
.ctrl>*{pointer-events:auto}
.ctrl .sp{flex:1;min-width:0;pointer-events:none}
.ctrl .sq{flex:none;white-space:nowrap}
.ctrl .pill{flex:none}
.pill{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pill.off .dot{background:var(--danger)} .pill.sync .dot{background:var(--accent)}
.sq{min-width:44px;min-height:44px;border-radius:14px;padding:0 12px;font-weight:700;font-size:13px;border:1px solid var(--line)}
.card{position:absolute;left:10px;right:10px;bottom:66px;margin:auto;max-width:430px;padding:12px 14px 12px 22px;display:flex;gap:12px;align-items:center;overflow:hidden}
.card[hidden]{display:none}
.card .cband{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--gc,var(--accent));z-index:1}
.card .ctitle{font:600 17px/1.2 var(--serif)}
.card .cbody{font-size:13.5px;color:var(--ink2);margin-top:2px}
.card.danger{border-color:var(--danger)}

/* ---------- Buttons / dock ---------- */
.btn{min-height:48px;padding:6px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.09);font-weight:650;line-height:1.2;text-align:center;
  display:inline-flex;align-items:center;justify-content:center;max-width:100%;transition:transform .12s ease,background .15s ease,opacity .15s ease}
.btn:active{transform:scale(.97)}
.btn.small{min-height:44px;padding:4px 14px;border-radius:14px}
.btn.primary{background:linear-gradient(180deg,#f3cb8f,#dca25a);color:#1a1306;border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px rgba(233,184,114,.22)}
.btn[disabled]{opacity:.62;cursor:default;border-style:dashed;transform:none;box-shadow:none}
.btn[hidden]{display:none}
.dock-msg .t{font:600 18px/1.2 var(--serif)}
.dock-msg .s{color:var(--ink2);font-size:13.5px;margin-top:2px;min-height:1.35em}
.dock-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.dock-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dock-nav .btn{min-height:44px;padding:4px 2px;font-weight:600;font-size:13.5px;background:rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:34px}
@media (orientation:landscape) and (min-width:640px){.dock-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.dock-nav .btn{font-size:13.5px;padding:4px 8px}}
@media (orientation:landscape) and (min-width:1500px){.dock-nav{grid-template-columns:repeat(4,minmax(0,1fr))}.dock-nav .btn{font-size:13px;padding:4px 2px}}
.dock-actions .btn{min-width:0}
.dock-actions #btnSecondary{min-width:96px}
@media (orientation:portrait),(max-width:639px){.dock-actions #btnSecondary{white-space:nowrap}}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,8,9,.5);opacity:0;visibility:hidden;transition:opacity .28s,visibility 0s .28s;z-index:20}
.scrim.open{opacity:1;visibility:visible;transition-delay:0s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,560px);max-height:80dvh;max-height:80vh;z-index:21;border-radius:26px 26px 0 0;
  padding:8px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column;visibility:hidden;transform:translateY(110%);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s;background:rgba(18,32,38,.82)}
.sheet.open{visibility:visible;transform:none;transition-delay:0s}
.sheet.drag{transition:none}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:4px auto 8px;touch-action:none;position:relative}
.grab::after{content:"";position:absolute;left:-40px;right:-40px;top:-14px;bottom:-14px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h2{flex:1;min-width:0}
.sheet-body{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.hero{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:10px}
.swatch{flex:none;width:14px;align-self:stretch;border-radius:7px;background:var(--gc)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:6px 0;font-size:14px}
.kv span:nth-child(odd){color:var(--ink2)} .kv span:nth-child(even){font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.list{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left;width:100%}
.row .sw{flex:none;width:10px;height:26px;border-radius:5px;background:var(--gc)}
.row .rn{flex:1;min-width:0}
.row .ro{font-size:12.5px;color:var(--ink2)}
.h3{font-weight:700;margin:12px 0 6px;font-size:13px;color:var(--ink2)}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.sw-row small{display:block;color:var(--ink2);font-size:12.5px}
.toggle{min-width:76px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700}
.toggle[aria-checked="true"]{background:var(--sea);color:#06201c;border-color:transparent}
.log{display:grid;gap:4px;font-size:13.5px}.log div{padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
select{min-height:44px;border-radius:12px;background:#142329;color:var(--ink);border:1px solid var(--line);padding:0 10px;font:inherit}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(3,8,9,.62);opacity:0}
.modal[hidden]{display:none}
.modal .box{width:min(100%,420px);padding:22px;text-align:center}
.modal h2{font-size:28px;margin-bottom:6px}
.modal .res{margin:14px 0;display:grid;gap:6px;text-align:left}

/* ---------- Reduced motion / effects ---------- */
.rm *,.rm *::before,.rm *::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.inp{width:100%;min-height:48px;border-radius:14px;background:#142329;color:var(--ink);border:1px solid var(--line);padding:0 12px;font:inherit}

/* ---------- Tengah papan: koran berita + panel lelang ---------- */
.center{justify-content:flex-start;align-items:stretch;gap:0;padding:30px 46px 28px}
.news{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;transition:opacity .25s}
.center.aucing .news{opacity:0}
.mast-t{font:700 52px/1 var(--serif);letter-spacing:.08em;text-align:center;color:rgba(234,243,241,.92)}
.mast-s{text-align:center;font:italic 22px var(--serif);color:var(--ink2);margin-top:8px;padding-bottom:12px;border-bottom:3px double rgba(255,255,255,.22)}
.lead{padding:0 2px}
.lead-k{font:700 17px var(--sans);letter-spacing:.22em;color:var(--accent)}
.lead-h{font:600 34px/1.2 var(--serif);margin-top:8px;height:3.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;color:var(--ink)}
.nl-h{font:700 16px var(--sans);letter-spacing:.22em;color:var(--ink2);padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.14)}
.nl-box{flex:1;min-height:0;overflow:hidden}
.nl-i{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font:500 21px/1.2 var(--serif);color:rgba(234,243,241,.9);border-bottom:1px dotted rgba(255,255,255,.12)}
.nl-i .ic{flex:none;width:34px;text-align:center;font-size:22px;line-height:1.2}
.nl-i .tx{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nl-i.old{opacity:.62}
.rank-r{display:grid;grid-template-columns:30px 132px minmax(0,1fr) 132px;gap:12px;align-items:center;font:600 20px var(--sans);margin:5px 0}
.rank-r .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-r .rv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank-bar{height:16px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.rank-bar i{display:block;height:100%;background:var(--pc);width:0;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rank-r.out{opacity:.45}

.auc{position:absolute;left:26px;top:26px;right:26px;bottom:26px;border-radius:26px;padding:20px 26px;display:flex;flex-direction:column;gap:10px;
  background:rgba(9,20,25,.98);border:2px solid var(--accent);box-shadow:0 0 0 6px rgba(233,184,114,.12),0 22px 54px rgba(0,0,0,.55);
  pointer-events:auto;z-index:5;overflow:hidden;-webkit-user-select:none;user-select:none}
.auc[hidden]{display:none}
.a-head{display:flex;gap:16px;align-items:stretch}
.a-sw{flex:none;width:16px;border-radius:8px;background:var(--gc,var(--accent))}
.a-ht{min-width:0;flex:1}
.a-k{font:700 20px var(--sans);letter-spacing:.24em;color:var(--accent)}
.a-name{font:600 48px/1.05 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-sub{font:500 26px var(--sans);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-timer{display:flex;align-items:center;gap:16px}
.a-sec{flex:none;width:112px;font:700 54px/1 var(--sans);font-variant-numeric:tabular-nums;text-align:right}
.a-bar{flex:1;height:24px;border-radius:12px;background:rgba(255,255,255,.1);overflow:hidden}
.a-bar i{display:block;height:100%;width:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--sea),var(--accent));border-radius:12px}
.a-timer.hot .a-sec{color:var(--danger);animation:aucPulse .5s ease-in-out infinite alternate}
.a-timer.hot .a-bar i{background:var(--danger)}
@keyframes aucPulse{from{transform:scale(1)}to{transform:scale(1.12)}}
.a-now{text-align:center;padding:2px 0}
.a-nk{font:700 22px var(--sans);letter-spacing:.2em;color:var(--ink2)}
.a-amt{font:700 92px/1.02 var(--serif);font-variant-numeric:tabular-nums;color:var(--ink)}
.a-who{font:600 30px/1.2 var(--sans);color:var(--ink2);min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-who.has{color:var(--ink)}
.a-who.has::before{content:"";display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--pc);border:3px solid rgba(255,255,255,.85);margin-right:12px;vertical-align:-3px}

@keyframes tt-skull{0%{transform:scale(.1) rotate(0);opacity:0}30%{transform:scale(1.6) rotate(360deg);opacity:1}45%{transform:scale(1.25) rotate(350deg)}80%{opacity:1;transform:scale(1.35) rotate(360deg)}100%{opacity:0;transform:scale(1.35) translateY(50px) rotate(360deg)}}
@keyframes tt-wave{0%{transform:translateX(-170px);opacity:0}20%{opacity:1}40%{transform:translateX(45px) rotate(6deg)}60%{transform:translateX(-45px) rotate(-6deg)}80%{transform:translateX(22px);opacity:1}100%{transform:translateX(170px);opacity:0}}
@keyframes tt-crab{0%{transform:translateX(160px) scaleX(-1);opacity:0}12%{opacity:1}30%{transform:translate(90px,-12px) scaleX(-1)}45%{transform:translate(30px,0) scaleX(-1)}60%{transform:translate(-30px,-12px) scaleX(-1)}80%{transform:translate(-100px,0) scaleX(-1);opacity:1}100%{transform:translateX(-180px) scaleX(-1);opacity:0}}
@keyframes tt-flag{0%{transform:rotate(0);opacity:0}14%{opacity:1;transform:rotate(-28deg)}34%{transform:rotate(28deg)}54%{transform:rotate(-20deg)}74%{transform:rotate(12deg);opacity:1}100%{transform:rotate(0);opacity:0}}

const mortOf=pos=>Math.floor(BOARD[pos].price/2);
const ownedBy=(s,p)=>Object.keys(s.owners).map(Number).filter(i=>s.owners[i]===p);
const fullSet=(s,p,g)=>GROUP_SPACES[g].every(i=>s.owners[i]===p);
const lvCost=(g,lv)=>HOUSE_COST[g]*(lv===3?2:1);
const builtValue=(s,pos)=>{ let v=0; for(let l=1;l<=(s.builds[pos]||0);l++) v+=lvCost(BOARD[pos].group,l); return v; };
const propValue=(s,pos)=>BOARD[pos].price+builtValue(s,pos);
const takeoverPrice=(s,pos)=>2*propValue(s,pos);
const buildCost=(s,pos)=>Math.round(lvCost(BOARD[pos].group,(s.builds[pos]||0)+1)*(s.mods.buildMul||1));
const permitFee=(s,pos)=>{ const g=BOARD[pos].group, pm=s.permits[g]||{}, lv=(s.builds[pos]||0)+1;
  const base=(lv===1&&!pm.h)?20:(lv===3&&!pm.H)?50:0; return Math.round(base*(s.mods.permitMul==null?1:s.mods.permitMul)); };
const redeemCost=(s,pos)=>Math.ceil(Math.round(mortOf(pos)*(s.mods.redeem||1.1)*100)/100);
function buildErr(s,p,pos){
  const sp=BOARD[pos];
  if(sp.type!=='prop'||s.owners[pos]!==p) return 'Kamu tidak memiliki properti itu.';
  if(s.mort[pos]) return 'Tebus gadainya dulu.';
  if((s.builds[pos]||0)>=3) return 'Sudah berstatus landmark.';
  if(s.players[p].cash<buildCost(s,pos)+permitFee(s,pos)) return 'Uang tidak cukup.';
  return null;
}
function sellErr(s,p,pos){ const lv=s.builds[pos]||0; return (s.owners[pos]!==p||!lv||lv>=3)?'Tidak ada yang bisa dijual (landmark permanen).':null; }
function mortErr(s,p,pos){
  const sp=BOARD[pos];
  if(s.owners[pos]!==p||sp.price==null) return 'Bukan milikmu.'; if(s.mort[pos]) return 'Sudah digadaikan.';
  if((s.builds[pos]||0)>0) return 'Jual bangunannya dulu.'; return null;
}
function redeemErr(s,p,pos){ if(s.owners[pos]!==p||!s.mort[pos]) return 'Tidak sedang digadai.'; return s.players[p].cash<redeemCost(s,pos)?'Uang tidak cukup.':null; }
const TAKE_MS=25000, PICK_MS=20000;     /* batas waktu menjawab tawaran ambil alih / memilih korban kartu */
function takeErr(s,p,pos,price){
  const sp=BOARD[pos], o=s.owners[pos];
  if(!sp||sp.type!=='prop') return 'Hanya properti kawasan yang bisa diambil alih.';
  if(o===undefined||o===p||!s.players[o]||s.players[o].out) return 'Properti itu bukan milik pemain lain.';
  if(s.mort[pos]) return 'Properti yang sedang digadai tidak bisa diambil alih.';
  if((s.builds[pos]||0)>=3) return 'Landmark permanen, tidak bisa diambil alih.';
  const min=takeoverPrice(s,pos);
  if(!Number.isFinite(price)||price<min) return 'Harga minimal M$'+min+' (2× nilai properti beserta bangunannya).';
  if(price>s.players[p].cash) return 'Uangmu tidak cukup.';
  return null;
}
function worthOf(s,i){
  let w=s.players[i].cash;
  for(const k of ownedBy(s,i)) w+=BOARD[k].price-(s.mort[k]?mortOf(k):0)+builtValue(s,k);
  const d=s.debt[i]; if(d) w-=d.amt; return w;
}

function createState(names,rounds){
  return {seq:0,players:names.map((n,i)=>({id:i,name:n,cash:START_CASH,pos:0,jail:0,out:false})),
    owners:{},builds:{},mort:{},permits:{},houses:HOUSE_CAP,hotels:HOTEL_CAP,treasury:0,round:0,rounds:rounds||ROUNDS,mods:{},auction:null,tradeOffer:null,takeOffer:null,pick:null,vote:null,voteRound:0,
    jailCards:names.map(()=>0),aid:{},debt:{},turn:0,turnCount:0,phase:'idle',offer:null,doubles:0,lastRoll:null,winner:null,endReason:null};
}
/* Pure state transition. Used by the server, by the client "truth" mirror, and by the client "view" (what has been presented so far). */
function reduce(s, ev){
  s.seq = ev.seq;
  const P = s.players;
  switch(ev.type){
    case 'TURN_START': s.turn=ev.player; s.turnCount++; s.phase='roll'; s.doubles=0; s.offer=null; s.tradeOffer=null; s.takeOffer=null; s.pick=null; break;
    case 'DICE_ROLLED': s.lastRoll={player:ev.player,d1:ev.d1,d2:ev.d2,total:ev.d1+ev.d2}; s.doubles=ev.doubles; P[ev.player].pos=ev.to; s.phase='resolve'; break;
    case 'MOVED': P[ev.player].pos=ev.to; break;
    case 'PASSED_GO': P[ev.player].cash+=ev.amount; break;
    case 'CASH': P[ev.player].cash+=ev.amount; break;
    case 'TAX': P[ev.player].cash-=ev.amount; if(ev.gov) s.treasury+=ev.amount; break;
    case 'RENT': P[ev.from].cash-=ev.amount; P[ev.to].cash+=ev.amount; break;
    case 'OFFER': s.phase='offer'; s.offer={player:ev.player,pos:ev.pos,price:ev.price}; break;
    case 'BOUGHT': P[ev.player].cash-=ev.price; s.owners[ev.pos]=ev.player; s.offer=null; break;
    case 'DECLINED': s.offer=null; break;
    case 'JAILED': P[ev.player].jail=3; if(ev.player===s.turn) s.doubles=0; break;
    case 'FREED': P[ev.player].jail=0; break;
    case 'JAIL_FAIL': P[ev.player].jail=ev.left; break;
    case 'BANKRUPT':
      if(s.takeOffer&&(s.takeOffer.from===ev.player||s.takeOffer.to===ev.player)) s.takeOffer=null;
      P[ev.player].out=true; P[ev.player].cash=0; P[ev.player].jail=0; delete s.debt[ev.player]; s.jailCards[ev.player]=0;
      for(const k of Object.keys(s.owners)){ if(s.owners[k]===ev.player){
        delete s.builds[k];
        if(ev.creditor!=null) s.owners[k]=ev.creditor; else{ delete s.owners[k]; delete s.mort[k]; } } }
      break;
    case 'ROUND': s.round=ev.round; s.mods={}; break;
    case 'POLICY': Object.assign(s.mods,ev.mods||{}); break;
    case 'BUILD':{ const lv=(s.builds[ev.pos]||0)+1, g=BOARD[ev.pos].group; s.builds[ev.pos]=lv; s.offer=null;
      P[ev.player].cash-=ev.cost+ev.permit; s.treasury+=ev.permit;
      s.permits[g]=s.permits[g]||{}; if(lv===1) s.permits[g].h=1; if(lv===3) s.permits[g].H=1; break; }
    case 'SELL': s.builds[ev.pos]--; P[ev.player].cash+=ev.amount; break;
    case 'OFFER2': s.phase=ev.kind; s.offer={player:ev.player,pos:ev.pos,price:ev.price}; break;
    case 'TAKEOVER': P[ev.player].cash-=ev.price; P[ev.from].cash+=ev.price; s.owners[ev.pos]=ev.player; delete s.mort[ev.pos]; s.offer=null; s.takeOffer=null; break;
    case 'TAKE_OFFER': s.takeOffer={from:ev.from,to:ev.to,pos:ev.pos,price:ev.price}; break;
    case 'TAKE_CLEAR': s.takeOffer=null; break;
    case 'XFER': P[ev.from].cash-=ev.amount; P[ev.to].cash+=ev.amount; break;
    case 'PICK_START': s.pick={player:ev.player,fx:ev.fx,amount:ev.amount,targets:ev.targets,text:ev.text,deck:ev.deck}; s.phase='pick'; break;
    case 'PICK_END': s.pick=null; break;
    case 'TRADE': ev.give.forEach(k=>{ s.owners[k]=ev.with; }); ev.get.forEach(k=>{ s.owners[k]=ev.player; }); P[ev.player].cash-=ev.cash; P[ev.with].cash+=ev.cash; break;
    case 'TRADE_PROPOSE': s.tradeOffer=ev.offer; break;
    case 'TRADE_CLEAR': s.tradeOffer=null; break;
    case 'VOTE_START': s.vote={votes:ev.votes,ret:s.phase}; s.voteRound=s.round; s.phase='vote'; break;
    case 'VOTE_CAST': s.vote.votes[ev.player]=ev.choice; break;
    case 'VOTE_END': s.vote=null; s.phase=ev.ret; break;
    case 'MORTGAGE': s.mort[ev.pos]=1; P[ev.player].cash+=ev.amount; break;
    case 'REDEEM': delete s.mort[ev.pos]; P[ev.player].cash-=ev.amount; break;
    case 'GRANT': P[ev.player].cash+=ev.amount; s.treasury-=ev.amount; s.aid[ev.player]=1; s.debt[ev.player]={amt:ev.amount,left:3,inst:Math.ceil(ev.amount/3)}; break;
    case 'STIM': P[ev.player].cash+=ev.amount; s.treasury-=ev.amount; break;
    case 'REPAY':{ P[ev.player].cash-=ev.amount; s.treasury+=ev.amount; const d=s.debt[ev.player]; d.amt-=ev.amount; d.left--; if(d.left<=0||d.amt<=0) delete s.debt[ev.player]; break; }
    case 'JAILCARD': s.jailCards[ev.player]=(s.jailCards[ev.player]||0)+ev.delta; break;
    case 'AUC_START': s.phase='auction'; s.auction={pos:ev.pos,bid:0,bidder:null,active:ev.order.slice(),n:0}; break;
    case 'BID':{ const a=s.auction; a.bid=ev.amount; a.bidder=ev.player; a.n++; break; }
    case 'AUC_PASS':{ const a=s.auction, i=a.active.indexOf(ev.player); if(i>=0) a.active.splice(i,1); if(a.bidder===ev.player) a.bidder=null; break; }
    case 'AUC_END': s.auction=null; break;
    case 'PHASE': s.phase=ev.phase; break;
    case 'GAME_OVER': s.winner=ev.winner; s.endReason=ev.reason||'last'; s.phase='over'; break;
    default: break; /* CARD, LANDED, NOTE: presentation-only */
  }
  return s;
}
const clone = o => JSON.parse(JSON.stringify(o));

function presentMs(ev){
  switch(ev.type){
    case 'TURN_START': return 650;
    case 'DICE_ROLLED': return 1050 + ev.path.length*300 + 400;
    case 'MOVED': return ev.glide ? 900 : ev.path.length*300;
    case 'RENT': case 'TAX': return 1300;
    case 'CARD': return 1500;
    case 'BANKRUPT': return 1700;
    case 'PASSED_GO': return 600;
    case 'BOUGHT': return 750;
    case 'BID': case 'AUC_PASS': return 80;
    case 'XFER': return 700;
    default: return 400;
  }
}

class GameServer {
  constructor(names, rng, rounds){ this.rounds=rounds||ROUNDS; this.state=createState(names,this.rounds); this.log=[]; this.subs=[]; this.acks=new Map(); this.rng=rng||Math.random; this.out=[]; this.aucT=0; this.takeT=0; this.pickT=0; }
  destroy(){ clearTimeout(this.aucT); clearTimeout(this.takeT); clearTimeout(this.pickT); this.aucT=this.takeT=this.pickT=0; this.subs=[]; }
  subscribe(f){ this.subs.push(f); }
  emit(ev){ ev.seq=this.state.seq+1; reduce(this.state,ev); this.log.push(ev); this.out.push(ev); return ev; }
  flush(){ const evs=this.out; this.out=[]; for(const ev of evs) for(const f of this.subs) f(ev); }
  snapshot(){ return clone(this.state); }
  eventsSince(seq){ return this.log.slice(seq).map(clone); }
  start(){ this.newRound(); this.emit({type:'TURN_START',player:0}); this.flush(); }
  die(){ return 1+Math.floor(this.rng()*6); }
  name(p){ return this.state.players[p].name; }

  submit(a){
    const prev=this.acks.get(a.id);
    if(prev) return Object.assign({dup:true},prev);            /* idempotent: same action id never runs twice */
    const err=this.validate(a);
    const ack=err?{id:a.id,ok:false,error:err}:{id:a.id,ok:true};
    this.acks.set(a.id,ack);
    if(!err) this.apply(a);
    this.flush();
    return ack;
  }
  validate(a){
    const s=this.state, p=a.player;
    if(s.winner!=null) return 'Permainan sudah selesai.';
    if(!s.players[p]||s.players[p].out) return 'Pemain tidak dikenal.';
    if(a.type==='BID'||a.type==='PASS_BID'){
      const A=s.auction;
      if(s.phase!=='auction'||!A) return 'Lelang sudah selesai.';
      if(A.active.indexOf(p)<0) return 'Kamu sudah mundur dari lelang.';
      if(a.type==='PASS_BID') return A.bidder===p?'Kamu sedang memegang tawaran tertinggi.':null;
      if(A.bidder===p) return 'Kamu sudah memegang tawaran tertinggi.';
      if(!Number.isFinite(a.amount)||a.amount<A.bid+10) return 'Keduluan! Tawaran sudah naik.';
      if(a.amount>A.bid+50) return 'Tawaran tidak valid.';
      return a.amount>s.players[p].cash?'Uang tidak cukup.':null;
    }
    if(a.type==='VOTE') return (s.phase==='vote'&&s.vote&&s.vote.votes[p]===undefined&&(a.choice==='end'||a.choice==='continue'))?null:'Kamu belum bisa voting sekarang.';
    if(a.type==='TRADE_REPLY') return (s.tradeOffer&&s.tradeOffer.to===p)?null:'Tidak ada tukar tambah untuk dijawab.';
    if(a.type==='TAKE_REPLY') return (s.takeOffer&&s.takeOffer.to===p)?null:'Tidak ada tawaran ambil alih untuk dijawab.';
    if(s.turn!==p) return 'Bukan giliranmu.';
    const pl=s.players[p], mg=(s.phase==='roll'||s.phase==='end');
    switch(a.type){
      case 'ROLL': return s.takeOffer?'Tunggu pemilik menjawab tawaran ambil alih.':s.phase==='roll'?null:'Kamu belum bisa melempar dadu.';
      case 'BUY': case 'DECLINE': return (s.phase==='offer'&&s.offer&&s.offer.player===p)?null:'Tidak ada yang bisa dibeli.';
      case 'END_TURN': return s.takeOffer?'Tunggu pemilik menjawab tawaran ambil alih.':s.phase==='end'?null:'Selesaikan langkahmu dulu.';
      case 'UPGRADE': return s.phase==='upgrade'&&s.offer&&s.offer.player===p?buildErr(s,p,s.offer.pos):'Tidak ada yang bisa di-upgrade.';
      case 'TAKE_PROPOSE':{ if(!(mg||s.phase==='takeover')) return 'Belum bisa sekarang.';
        if(s.takeOffer||s.tradeOffer) return 'Masih ada tawaran yang menunggu jawaban.';
        return takeErr(s,p,a.pos,+a.price); }
      case 'PICK': return (s.phase==='pick'&&s.pick&&s.pick.player===p&&s.pick.targets.indexOf(a.target)>=0&&s.players[a.target]&&!s.players[a.target].out)?null:'Pilihan tidak valid.';
      case 'SKIP': return (s.phase==='upgrade'||s.phase==='takeover')&&s.offer&&s.offer.player===p?null:'Tidak ada yang bisa dilewati.';
      case 'TRADE': return mg&&!s.tradeOffer&&!s.takeOffer?this.tradeErr(a):'Belum bisa, atau masih ada tawaran yang menunggu.';
      case 'CALL_VOTE': return mg&&s.voteRound!==s.round?null:'Voting sudah dilakukan di putaran ini.';
      case 'SELL': return mg?sellErr(s,p,a.pos):'Belum bisa sekarang.';
      case 'MORTGAGE': return mg?mortErr(s,p,a.pos):'Belum bisa sekarang.';
      case 'REDEEM': return mg?redeemErr(s,p,a.pos):'Belum bisa sekarang.';
      case 'JAIL_PAY': return s.phase==='roll'&&pl.jail>0&&pl.cash>=JAIL_FINE?null:'Kamu belum bisa membayar denda.';
      case 'JAIL_CARD': return s.phase==='roll'&&pl.jail>0&&(s.jailCards[p]||0)>0?null:'Kamu tidak punya kartu untuk dipakai.';
      case 'AID': return mg&&!s.aid[p]&&pl.cash<100&&s.treasury>=100&&!s.mods.noAid?null:'Bantuan darurat tidak tersedia.';
      default: return 'Aksi tidak dikenal.';
    }
  }
  apply(a){
    const p=a.player, s=this.state, n=this.name(p);
    switch(a.type){
      case 'ROLL': this.roll(p); break;
      case 'BUY': this.emit({type:'BOUGHT',player:p,pos:s.offer.pos,price:s.offer.price}); this.finish(p); break;
      case 'DECLINE': { const pos=s.offer.pos; this.emit({type:'DECLINED',player:p,pos}); this.startAuction(p,pos); break; }
      case 'END_TURN': this.nextTurn(p); break;
      case 'UPGRADE': this.doUpgrade(p,s.offer.pos); break;
      case 'TAKE_PROPOSE':{ const o=s.owners[a.pos], price=Math.round(a.price), inPhase=s.phase==='takeover';
        this.emit({type:'TAKE_OFFER',from:p,to:o,pos:a.pos,price,ms:TAKE_MS,text:n+' mengajukan ambil alih '+BOARD[a.pos].name+' dari '+this.name(o)+' seharga M$'+price});
        this.armTake(TAKE_MS); if(inPhase) this.finish(p); break; }
      case 'TAKE_REPLY':{ const o=s.takeOffer; clearTimeout(this.takeT); this.takeT=0;
        if(a.accept&&s.owners[o.pos]===o.to&&!takeErr(s,o.from,o.pos,o.price)) this.emit({type:'TAKEOVER',player:o.from,from:o.to,pos:o.pos,price:o.price,text:n+' menerima tawaran '+this.name(o.from)+' atas '+BOARD[o.pos].name+' (M$'+o.price+')'});
        else this.emit({type:'NOTE',text:a.accept?'Kesepakatan batal: syaratnya sudah tidak terpenuhi.':n+' menolak tawaran ambil alih '+BOARD[o.pos].name+'.'});
        this.emit({type:'TAKE_CLEAR'}); break; }
      case 'PICK': this.doPick(p,a.target); break;
      case 'SKIP': this.finish(p); break;
      case 'TRADE': this.emit({type:'TRADE_PROPOSE',offer:{from:p,to:a.with,give:a.give||[],get:a.get||[],cash:Math.round(+a.cash||0)},text:n+' mengajukan tukar tambah ke '+this.name(a.with)}); break;
      case 'TRADE_REPLY': { const o=s.tradeOffer;
        if(a.accept&&!this.tradeErr({player:o.from,with:o.to,give:o.give,get:o.get,cash:o.cash})) this.emit({type:'TRADE',player:o.from,with:o.to,give:o.give,get:o.get,cash:o.cash,text:n+' menerima tukar tambah dengan '+this.name(o.from)});
        else this.emit({type:'NOTE',text:n+' menolak tukar tambah.'});
        this.emit({type:'TRADE_CLEAR'}); break; }
      case 'CALL_VOTE': this.callVote(); break;
      case 'VOTE': this.emit({type:'VOTE_CAST',player:p,choice:a.choice,text:n+' memilih '+(a.choice==='end'?'mengakhiri permainan':'lanjut main')}); this.voteCheck(); break;
      case 'SELL': this.sell(p,a.pos); break;
      case 'MORTGAGE': this.mortgage(p,a.pos); break;
      case 'REDEEM': this.emit({type:'REDEEM',player:p,pos:a.pos,amount:redeemCost(s,a.pos),text:n+' menebus '+BOARD[a.pos].name}); break;
      case 'JAIL_PAY': this.emit({type:'CASH',player:p,amount:-JAIL_FINE,reason:'fine'}); this.emit({type:'FREED',player:p,reason:'fine'}); break;
      case 'JAIL_CARD': this.emit({type:'JAILCARD',player:p,delta:-1}); this.emit({type:'FREED',player:p,reason:'card'}); break;
      case 'AID': this.emit({type:'GRANT',player:p,amount:100,text:n+' mengambil bantuan darurat M$100 (cicil 3 putaran)'}); break;
      case 'BID': this.emit({type:'BID',player:p,amount:a.amount,prev:s.auction.bidder,ms:AUC_RESET,text:n+' menawar M$'+a.amount}); this.aucCheck(); if(this.state.auction) this.armAuction(AUC_RESET); break;
      case 'PASS_BID': this.emit({type:'AUC_PASS',player:p,text:n+' mundur dari lelang'}); this.aucCheck(); break;
    }
  }
  nextTurn(p){
    const ps=this.state.players, s=this.state;
    for(let k=1;k<=ps.length;k++){ const q=(p+k)%ps.length; if(ps[q].out) continue;
      let nr=false; if(q<=p){ if(s.round>=this.rounds) return this.endByWorth(); this.newRound(); nr=true; }
      this.emit({type:'TURN_START',player:q}); if(nr&&s.round%10===0) this.callVote(); return; }
  }
  alive(){ return this.state.players.filter(x=>!x.out); }
  sell(p,pos){ const amt=Math.floor(lvCost(BOARD[pos].group,this.state.builds[pos])/2);
    this.emit({type:'SELL',player:p,pos,amount:amt,text:this.name(p)+' menjual bangunan di '+BOARD[pos].name+' (+M$'+amt+')'}); }
  mortgage(p,pos){ const amt=mortOf(pos);
    this.emit({type:'MORTGAGE',player:p,pos,amount:amt,text:this.name(p)+' menggadaikan '+BOARD[pos].name+' (+M$'+amt+')'}); }
  raise(p,need){
    const s=this.state, pl=s.players[p];
    while(pl.cash<need){
      const own=ownedBy(s,p), b=own.filter(i=>s.builds[i]>0&&s.builds[i]<3).sort((x,y)=>s.builds[y]-s.builds[x])[0];
      if(b!==undefined){ this.sell(p,b); continue; }
      const m=own.filter(i=>!s.mort[i]&&!(s.builds[i]>0)).sort((x,y)=>BOARD[x].price-BOARD[y].price)[0];
      if(m===undefined) break; this.mortgage(p,m);
    }
  }
  govPay(p,amount,label){ const pay=Math.min(amount,this.state.players[p].cash); if(pay>0) this.emit({type:'TAX',player:p,amount:pay,full:amount,gov:true,label}); }
  newRound(){
    const s=this.state, r=s.round+1;
    this.emit({type:'ROUND',round:r,text:'Putaran '+r+(this.rounds<999?' dari '+this.rounds:'')+(r===this.rounds?' · putaran terakhir':'')});
    this.alive().forEach(pl=>{ const d=s.debt[pl.id]; if(!d) return; const amt=Math.min(d.inst,d.amt,pl.cash);
      if(amt>0) this.emit({type:'REPAY',player:pl.id,amount:amt,text:pl.name+' mencicil M$'+amt+' bantuan'}); });
    const pol=POLICIES[Math.floor(this.rng()*POLICIES.length)];
    this.emit({type:'POLICY',mods:pol.mods||{},text:'Kebijakan: '+pol.name+' · '+pol.text});
    if(pol.tax) this.alive().forEach(pl=>this.govPay(pl.id,pol.tax,pol.name));
    if(r>1&&this.die()===1){ const c=CRISES[Math.floor(this.rng()*CRISES.length)];
      this.emit({type:'POLICY',mods:c.mods||{},text:'Krisis: '+c.name+' · '+c.text}); if(c.run) c.run(this); }
  }
  armTake(ms){ clearTimeout(this.takeT); this.takeT=setTimeout(()=>{ this.takeT=0; const s=this.state;
    if(s.takeOffer&&s.winner==null){ this.emit({type:'NOTE',text:this.name(s.takeOffer.to)+' tidak menjawab. Tawaran ambil alih otomatis ditolak.'}); this.emit({type:'TAKE_CLEAR'}); this.flush(); } },ms); }
  armPick(ms){ clearTimeout(this.pickT); this.pickT=setTimeout(()=>{ this.pickT=0; const s=this.state;
    if(s.pick&&s.winner==null&&s.phase==='pick'){ const t=s.pick.targets.filter(x=>!s.players[x].out);
      if(t.length){ this.doPick(s.pick.player,t[Math.floor(this.rng()*t.length)]); this.flush(); } } },ms); }
  doPick(p,target){
    const pk=this.state.pick; clearTimeout(this.pickT); this.pickT=0;
    this.emit({type:'PICK_END'});
    if(this.cardEffect(p,pk.fx,pk.amount,target)==='bankrupt') return;
    this.finish(p);
  }
  xfer(from,to,amount,kind){ const amt=Math.min(amount,Math.max(0,this.state.players[from].cash)); if(amt>0) this.emit({type:'XFER',from,to,amount:amt,full:amount,kind}); }
  cardEffect(p,fx,amount,target){
    const s=this.state, n=this.name(p);
    switch(fx){
      case 'steal': this.xfer(target,p,amount,'steal'); return 'done';
      case 'jailother': this.emit({type:'NOTE',text:n+' memenjarakan '+this.name(target)+' tanpa alasan jelas.'}); this.sendToJail(target); return 'done';
      case 'swap':{ const a=s.players[p].pos, b=s.players[target].pos;
        this.emit({type:'MOVED',player:p,from:a,to:b,path:[b],glide:true,reason:'swap'});
        this.emit({type:'MOVED',player:target,from:b,to:a,path:[a],glide:true,reason:'swap'});
        this.emit({type:'NOTE',text:n+' bertukar posisi dengan '+this.name(target)+'.'}); return 'done'; }
      case 'sendhome': this.emit({type:'MOVED',player:target,from:s.players[target].pos,to:0,path:[0],glide:true,reason:'home'}); this.xfer(target,p,amount,'steal'); return 'done';
      case 'collect': this.alive().forEach(x=>{ if(x.id!==p) this.xfer(x.id,p,amount,'collect'); }); return 'done';
      case 'payeach':{ const others=this.alive().filter(x=>x.id!==p); if(s.players[p].cash<amount*others.length) this.raise(p,amount*others.length); others.forEach(x=>this.xfer(p,x.id,amount,'gift')); return 'done'; }
      case 'treasury':{ const amt=Math.min(s.treasury,amount);
        if(amt>0) this.emit({type:'STIM',player:p,amount:amt,text:n+' merampok kas pemerintah M$'+amt}); else this.emit({type:'NOTE',text:'Kas pemerintah kosong. Rampokan sia-sia.'}); return 'done'; }
      case 'gamble':{ if(this.rng()<.5){ this.emit({type:'CASH',player:p,amount:amount.win,reason:'card'}); return 'done'; } return this.charge(p,amount.lose,null,'card')?'done':'bankrupt'; }
    }
    return 'done';
  }
  startAuction(p,pos){
    const ps=this.state.players, order=[]; for(let k=1;k<=ps.length;k++){ const q=(p+k)%ps.length; if(!ps[q].out) order.push(q); }
    this.emit({type:'AUC_START',pos,order,ms:AUC_FIRST,text:'Lelang dibuka: '+BOARD[pos].name+' · rebutan!'});
    this.armAuction(AUC_FIRST); this.aucCheck();
  }
  armAuction(ms){ clearTimeout(this.aucT); this.aucT=setTimeout(()=>{ this.aucT=0; if(this.state.auction&&this.state.winner==null){ this.aucFinish(); this.flush(); } },ms); }
  aucCheck(){
    const s=this.state, a=s.auction; if(!a) return;
    const rivals=a.active.filter(i=>i!==a.bidder&&!s.players[i].out), canRaise=rivals.some(i=>s.players[i].cash>=a.bid+10);
    if(a.active.length===0||(a.bidder!=null&&(a.active.length===1||!canRaise))||(a.bidder==null&&!canRaise)) this.aucFinish();
  }
  aucFinish(){
    const s=this.state, a=s.auction; if(!a) return;
    clearTimeout(this.aucT); this.aucT=0;
    const w=a.bidder, pos=a.pos, price=a.bid, t=s.turn;
    this.emit({type:'AUC_END',pos,bidder:w,bid:price});
    if(w!=null) this.emit({type:'BOUGHT',player:w,pos,price}); else this.emit({type:'NOTE',text:'Tidak ada tawaran. '+BOARD[pos].name+' tetap milik bank.'});
    this.finish(t);
  }
  forfeit(p){
    const s=this.state; if(s.winner!=null||s.players[p].out) return;
    const wasTurn=s.turn===p, vote=s.phase==='vote';
    if(s.pick&&s.pick.player===p){ clearTimeout(this.pickT); this.pickT=0; }
    if(s.auction&&wasTurn){ clearTimeout(this.aucT); this.aucT=0; this.emit({type:'AUC_END',pos:s.auction.pos,bidder:null,bid:0}); }
    else if(s.auction&&s.auction.active.indexOf(p)>=0) this.emit({type:'AUC_PASS',player:p,text:this.name(p)+' keluar dari lelang'});
    this.emit({type:'BANKRUPT',player:p,creditor:null});
    const al=this.alive(); if(al.length===1){ this.emit({type:'GAME_OVER',winner:al[0].id}); return; }
    if(s.tradeOffer&&(s.tradeOffer.from===p||s.tradeOffer.to===p)) this.emit({type:'TRADE_CLEAR'});
    if(s.auction){ this.aucCheck(); if(this.state.auction) this.armAuction(AUC_RESET); }
    if(vote){ this.voteCheck(); return; }
    if(wasTurn&&s.phase!=='over') this.nextTurn(p);
  }
  doUpgrade(p,pos){
    const s=this.state, lv=(s.builds[pos]||0)+1;
    this.emit({type:'BUILD',player:p,pos,cost:buildCost(s,pos),permit:permitFee(s,pos),text:this.name(p)+' meng-upgrade '+BOARD[pos].name+' ke '+(lv===3?'Landmark · kini permanen':'Lv '+lv)});
    if(!this.offerUpgrade(p,pos)) this.finish(p);
  }
  offerUpgrade(p,pos){ const s=this.state; if(buildErr(s,p,pos)) return false;
    this.emit({type:'OFFER2',kind:'upgrade',player:p,pos,price:buildCost(s,pos)+permitFee(s,pos)}); return true; }
  afterRent(p,pos){
    const s=this.state; if(BOARD[pos].type!=='prop'||(s.builds[pos]||0)>=3||s.mort[pos]) return 'done';
    const price=takeoverPrice(s,pos); if(s.players[p].cash<price) return 'done';
    this.emit({type:'OFFER2',kind:'takeover',player:p,pos,price}); return 'wait';
  }
  tradeErr(a){
    const s=this.state, p=a.player, w=a.with, give=a.give||[], get=a.get||[], cash=Math.round(+a.cash||0);
    if(!s.players[w]||w===p||s.players[w].out) return 'Pilih pemain lain.';
    if(!give.length&&!get.length) return 'Pilih minimal satu properti.';
    if(give.some(k=>s.owners[k]!==p||s.builds[k]===3)||get.some(k=>s.owners[k]!==w||s.builds[k]===3)) return 'Landmark dan properti yang bukan milik pihak terkait tidak bisa ditukar.';
    if((cash>0&&cash>s.players[p].cash)||(cash<0&&-cash>s.players[w].cash)) return 'Uang tidak cukup untuk kesepakatan itu.';
    return null;
  }
  trade(a){
    const s=this.state, p=a.player, w=a.with, give=a.give||[], get=a.get||[], cash=Math.round(+a.cash||0);
    const val=k=>propValue(s,k)*(s.mort[k]?.6:1);
    const rec=give.reduce((x,k)=>x+val(k),0)+cash, lose=get.reduce((x,k)=>x+val(k),0);
    if(rec>=lose*1.1&&rec>0) this.emit({type:'TRADE',player:p,with:w,give,get,cash,text:this.name(w)+' menerima tukar tambah dengan '+this.name(p)});
    else this.emit({type:'NOTE',text:this.name(w)+' menolak tukar tambah.'});
  }
  callVote(){
    const s=this.state, al=this.alive(), ws=al.map(x=>worthOf(s,x.id)), avg=ws.reduce((x,y)=>x+y,0)/ws.length, votes={};
    this.emit({type:'VOTE_START',votes,text:'Voting: akhiri permainan sekarang?'});
    this.voteCheck();
  }
  voteCheck(){
    const s=this.state, v=s.vote; if(!v) return;
    const al=this.alive(); if(al.some(pl=>v.votes[pl.id]===undefined)) return;
    const e=al.filter(pl=>v.votes[pl.id]==='end').length;
    if(e*2>al.length){ this.emit({type:'VOTE_END',ret:v.ret,text:'Mayoritas pemain memilih mengakhiri permainan.'}); this.endByWorth('vote'); }
    else{ this.emit({type:'VOTE_END',ret:v.ret,text:'Voting gagal. Permainan lanjut.'}); if(s.players[s.turn].out&&s.phase!=='over') this.nextTurn(s.turn); }
  }
  endByWorth(r){
    const s=this.state, sc=i=>[worthOf(s,i),s.players[i].cash,ownedBy(s,i).filter(k=>!s.mort[k]).reduce((x,k)=>x+BOARD[k].price,0)];
    const ids=this.alive().map(x=>x.id).sort((a,b)=>{ const x=sc(a),y=sc(b); return (y[0]-x[0])||(y[1]-x[1])||(y[2]-x[2]); });
    this.emit({type:'GAME_OVER',winner:ids[0],reason:r||'time'});
  }
  finish(p){
    const s=this.state, pl=s.players[p];
    this.emit({type:'PHASE',phase:(s.doubles>0&&pl.jail===0&&!pl.out)?'roll':'end'});
  }
  roll(p){
    const s=this.state, pl=s.players[p];
    const d1=this.die(), d2=this.die(), dbl=d1===d2, from=pl.pos;
    if(pl.jail>0){
      if(dbl){ this.emit({type:'FREED',player:p,reason:'doubles'}); return this.moveByRoll(p,d1,d2,0); }
      const left=pl.jail-1;
      if(left>0){
        this.emit({type:'DICE_ROLLED',player:p,d1,d2,from,to:from,path:[],doubles:0,passedGo:false});
        this.emit({type:'JAIL_FAIL',player:p,left});
        return this.finish(p);
      }
      this.emit({type:'FREED',player:p,reason:'fine'});
      if(!this.charge(p,50,null,'fine')) return;
      return this.moveByRoll(p,d1,d2,0);
    }
    const dcount=dbl?s.doubles+1:0;
    if(dcount>=3){
      this.emit({type:'DICE_ROLLED',player:p,d1,d2,from,to:from,path:[],doubles:0,passedGo:false});
      this.sendToJail(p); return this.finish(p);
    }
    return this.moveByRoll(p,d1,d2,dcount);
  }
  moveByRoll(p,d1,d2,doubles){
    const pl=this.state.players[p], from=pl.pos, total=d1+d2, path=[];
    for(let k=1;k<=total;k++) path.push((from+k)%NSP);
    const to=path[path.length-1], passed=from+total>=NSP;
    this.emit({type:'DICE_ROLLED',player:p,d1,d2,from,to,path,doubles,passedGo:passed});
    if(passed) this.emit({type:'PASSED_GO',player:p,amount:GO_BONUS});
    if(this.landing(p,to,0,total)==='done') this.finish(p);
  }
  sendToJail(p){
    const from=this.state.players[p].pos;
    this.emit({type:'MOVED',player:p,from,to:JAIL_POS,path:[JAIL_POS],glide:true,reason:'jail'});
    this.emit({type:'JAILED',player:p});
    return 'done';
  }
  rentFor(pos,total){
    const s=this.state, sp=BOARD[pos], owner=s.owners[pos];
    if(sp.type==='prop'){
      const full=GROUP_SPACES[sp.group].every(i=>s.owners[i]===owner), lv=s.builds[pos]||0;
      return sp.rent*(lv>0?RENT_MULT[lv]:full?2:1);
    }
    if(sp.type==='station'){ const n=STATIONS.filter(i=>s.owners[i]===owner).length; return 25*Math.pow(2,n-1); }
    const n=UTILITIES.filter(i=>s.owners[i]===owner).length;
    return (n>=2?10:4)*total;
  }
  charge(p,amount,creditor,kind,extra){
    const pl=this.state.players[p]; if(amount>pl.cash) this.raise(p,amount); const pay=Math.min(amount,pl.cash);
    if(kind==='rent') this.emit({type:'RENT',from:p,to:creditor,amount:pay,full:amount,pos:extra.pos});
    else if(kind==='tax') this.emit({type:'TAX',player:p,amount:pay,full:amount,pos:extra.pos,label:BOARD[extra.pos].name});
    else this.emit({type:'CASH',player:p,amount:-pay,reason:kind});
    if(pay<amount){ this.bankrupt(p,creditor); return false; }
    return true;
  }
  bankrupt(p,creditor){
    this.emit({type:'BANKRUPT',player:p,creditor:creditor==null?null:creditor});
    const alive=this.state.players.filter(x=>!x.out);
    if(alive.length===1) this.emit({type:'GAME_OVER',winner:alive[0].id});
    else this.nextTurn(p);
  }
  landing(p,pos,depth,total){
    const s=this.state, sp=BOARD[pos], pl=s.players[p];
    this.emit({type:'LANDED',player:p,pos});
    if(sp.type==='prop'||sp.type==='station'||sp.type==='utility'){
      const owner=s.owners[pos];
      if(owner===undefined){
        if(pl.cash>=sp.price){ this.emit({type:'OFFER',player:p,pos,price:sp.price}); return 'wait'; }
        this.emit({type:'NOTE',player:p,text:pl.name+' tidak mampu membeli '+sp.name+'.'}); this.startAuction(p,pos); return 'wait';
      }
      if(owner===p) return this.offerUpgrade(p,pos)?'wait':'done';
      if(s.mort[pos]){ this.emit({type:'NOTE',player:p,text:sp.name+' sedang digadai. Tidak ada sewa.'}); return 'done'; }
      if(!this.charge(p,this.rentFor(pos,total),owner,'rent',{pos})) return 'bankrupt';
      return this.afterRent(p,pos);
    }
    if(sp.type==='tax') return this.charge(p,sp.amount,null,'tax',{pos})?'done':'bankrupt';
    if(sp.type==='gojail') return this.sendToJail(p);
    if(sp.type==='chance'||sp.type==='chest') return this.drawCard(p,sp.type,depth,total);
    return 'done';
  }
  drawCard(p,deck,depth,total){
    if(depth>=1) return 'done';
    const list=CARDS[deck], card=list[Math.floor(this.rng()*list.length)];
    this.emit({type:'CARD',player:p,deck,text:card.text,cheat:!!card.cheat});
    if(card.keep){ this.emit({type:'JAILCARD',player:p,delta:1}); return 'done'; }
    if(card.cash>0){ this.emit({type:'CASH',player:p,amount:card.cash,reason:'card'}); return 'done'; }
    if(card.cash<0) return this.charge(p,-card.cash,null,'card')?'done':'bankrupt';
    if(card.jail) return this.sendToJail(p);
    if(card.fx){
      if(card.fx==='steal'||card.fx==='jailother'||card.fx==='swap'||card.fx==='sendhome'){
        const targets=this.alive().filter(x=>x.id!==p&&(card.fx==='steal'||x.jail===0)).map(x=>x.id);
        if(!targets.length){ this.emit({type:'NOTE',text:'Tidak ada korban yang cocok. Kartu hangus.'}); return 'done'; }
        if(targets.length===1) return this.cardEffect(p,card.fx,card.amount||0,targets[0]);
        this.emit({type:'PICK_START',player:p,fx:card.fx,amount:card.amount||0,targets,text:card.text,deck,ms:PICK_MS});
        this.armPick(PICK_MS); return 'wait';
      }
      return this.cardEffect(p,card.fx,card.amount||0,null);
    }
    const pl=this.state.players[p], from=pl.pos;
    let dest=card.moveTo!=null?card.moveTo:null;
    if(dest==null&&card.nearest){ for(let k=1;k<=NSP;k++){ const q=(from+k)%NSP; if(BOARD[q].type===card.nearest){ dest=q; break; } } }
    if(dest!=null){
      const steps=(dest-from+NSP)%NSP, path=[];
      for(let k=1;k<=steps;k++) path.push((from+k)%NSP);
      this.emit({type:'MOVED',player:p,from,to:dest,path,reason:'card'});
      if(from+steps>=NSP) this.emit({type:'PASSED_GO',player:p,amount:GO_BONUS});
      return this.landing(p,dest,depth+1,total);
    }
    if(card.back){
      const path=[]; for(let k=1;k<=card.back;k++) path.push((from-k+NSP)%NSP);
      const to=path[path.length-1];
      this.emit({type:'MOVED',player:p,from,to,path,reason:'card'});
      return this.landing(p,to,depth+1,total);
    }
    return 'done';
  }
}

/* Applies events in order, drops duplicates, holds back out-of-order events until the gap fills. */
class EventBuffer {
  constructor(startSeq,onEvent){ this.next=startSeq+1; this.pending=new Map(); this.onEvent=onEvent; this.dups=0; }
  push(ev){
    if(ev.seq<this.next||this.pending.has(ev.seq)){ this.dups++; return; }
    this.pending.set(ev.seq,ev); this.flush();
  }
  flush(){ while(this.pending.has(this.next)){ const e=this.pending.get(this.next); this.pending.delete(this.next); this.next++; this.onEvent(e); } }

const ticker={list:[],scale:1};

function baseScale(){ return clamp(Math.min(stageW,stageH*1.15)/(C*4.6),.5,1.3); }
function fitScale(){ return Math.min(stageW,stageH)/(BW+C*.4); }
function camUpdate(dtMs){
  const dt=Math.max(dtMs,1)/1000, ks=Math.min(ticker.scale,3);
  cam.base=baseScale();
  if(cam.mode!=='free'){
    let tx=cam.x,ty=cam.y,ts=cam.s,k=4.6;
    if(cam.mode==='overview'){ tx=BW/2; ty=BW/2; ts=fitScale(); k=4; }
    else if(cam.mode==='auction'){ tx=BW/2; ty=BW/2; ts=auctionScale(); k=4.4; }
    else{
      const tk=tokens[cam.focus];
      if(tk){
        const a=1-Math.exp(-6*dt);
        cam.vx+=((tk.x-cam.px)/dt-cam.vx)*a; cam.vy+=((tk.y-cam.py)/dt-cam.vy)*a;
        cam.px=tk.x; cam.py=tk.y;
        const la=clamp(tk.remaining/3,0,1);                 /* lookahead fades as the token nears its destination */
        tx=tk.x+clamp(cam.vx*.3,-C*.9,C*.9)*la; ty=tk.y+clamp(cam.vy*.3,-C*.9,C*.9)*la;
        k=tk.remaining>2?4.6:2.7+tk.remaining*.95;           /* tracking slows over the last two spaces */
      }
      ts=cam.base*cam.zoom;
    }
    if(cam.snap||settings.reducedMotion&&!tokenBusy()){ cam.x=tx;cam.y=ty;cam.s=ts;cam.snap=false; }
    else{ const ak=1-Math.exp(-k*ks*dt); cam.x+=(tx-cam.x)*ak; cam.y+=(ty-cam.y)*ak; cam.s+=(ts-cam.s)*(1-Math.exp(-3.4*dt)); }
  }
  const pad=C*.7, hw=stageW/(2*cam.s), hh=stageH/(2*cam.s);
  cam.x=BW+2*pad<2*hw?BW/2:clamp(cam.x,hw-pad,BW-hw+pad);
  cam.y=BW+2*pad<2*hh?BW/2:clamp(cam.y,hh-pad,BW-hh+pad);
  const t='translate3d('+(stageW/2-cam.x*cam.s).toFixed(2)+'px,'+(stageH/2-cam.y*cam.s).toFixed(2)+'px,0) scale('+cam.s.toFixed(4)+')';

}

function moveToken(pid,path,glide){
  const t=tokens[pid];
  if(cam.mode==='free') setCamMode('follow');
  if(settings.reducedMotion){
    const e=cellCenter(path[path.length-1]);
    return sleep(160).then(()=>{ t.x=e.x;t.y=e.y;t.hop=0;t.remaining=0;cam.snap=true; });
  }
  const pts=[{x:t.x,y:t.y}].concat(path.map(cellCenter));
  if(glide){
    const a=pts[0], b=pts[pts.length-1];
    return tween(780,p=>{ t.x=a.x+(b.x-a.x)*p; t.y=a.y+(b.y-a.y)*p; t.hop=Math.sin(Math.PI*p)*18; t.remaining=Math.max(0,(1-p)*3); },easeInOutCubic)
      .then(()=>{ t.hop=0; t.remaining=0; });
  }
  const n=pts.length-1, durs=[];
  for(let i=0;i<n;i++){ const left=n-1-i; durs.push(255*(left===0?1.9:left===1?1.45:left===2?1.15:1)); }
  const total=durs.reduce((a,b)=>a+b,0);
  let lastI=-1;
  return tween(total,p=>{
    let el=p*total, i=0; while(i<n-1&&el>durs[i]){ el-=durs[i]; i++; }
    if(i!==lastI){ lastI=i; sfx.step(); }
    const u=clamp(el/durs[i],0,1), e=.5*u+.5*easeSine(u);       /* gentle hop-to-hop pacing, never a full stop-start */
    const a=pts[i], b=pts[i+1];
    t.x=a.x+(b.x-a.x)*e; t.y=a.y+(b.y-a.y)*e; t.hop=Math.sin(Math.PI*u)*11; t.remaining=(n-1-i)+(1-u);
  }).then(()=>{ const f=pts[n]; t.x=f.x;t.y=f.y;t.hop=0;t.remaining=0; });
}

/* ---------- Efek suara (disintesis lewat WebAudio, tanpa file) ---------- */
const sfx=(function(){

    if(ctx) return ctx;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    try{
      ctx=new AC(); master=ctx.createGain(); master.gain.value=.55;
      const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
      nbuf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.5),ctx.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){ ctx=null; }

  }
  function ready(){ if(!settings.sound||document.hidden) return null; const c=ensure(); if(!c) return null; if(c.state==='suspended') c.resume().catch(()=>{}); return c; }

    const t=c.currentTime+(o.at||0), osc=c.createOscillator(), g=c.createGain(), v=o.v==null?.2:o.v;
    osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t); if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a||.006)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t+d+.03);
  }

    const c=ready(); if(!c||!nbuf) return; o=o||{};
    const t=c.currentTime+(o.at||0), src=c.createBufferSource(), g=c.createGain(), fl=c.createBiquadFilter(), v=o.v==null?.2:o.v;
    src.buffer=nbuf; fl.type=o.ft||'bandpass'; fl.frequency.setValueAtTime(o.f||1500,t); if(o.to) fl.frequency.exponentialRampToValueAtTime(o.to,t+d); fl.Q.value=o.q||1;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a||.004)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    src.connect(fl); fl.connect(g); g.connect(master); src.start(t,Math.random()*.2); src.stop(t+d+.03);
  }

    unlock(){ const c=ensure(); if(c&&c.state==='suspended') c.resume().catch(()=>{}); },

    dice(){ for(let i=0;i<7;i++) noise(.045,{at:i*.085+Math.random()*.02,f:1800+Math.random()*1500,q:3,v:.14}); tone(110,.2,{at:.62,v:.3,to:60}); noise(.08,{at:.62,f:300,v:.2}); },

    coinUp(){ once('cu',120,()=>{ tone(988,.12,{type:'square',v:.06}); tone(1319,.3,{at:.09,type:'square',v:.06}); }); },

    card(){ noise(.35,{f:500,to:3500,q:.8,v:.15}); tone(660,.15,{at:.3,v:.1}); },

function reactTo(ev){
  const q=ev.seq||0, pn=ev.pos!=null&&BOARD[ev.pos]?BOARD[ev.pos].name:'';
  switch(ev.type){
    case 'TURN_START': if(ev.player===ME) sfx.turn(); break;
    case 'LANDED': sfx.land(); break;
    case 'PASSED_GO': sfx.coinUp(); break;
    case 'BOUGHT':{
      sfx.buy(); worldFx(ev.pos,['✨','🎉','💰'],6); const N=nm(ev.player), m=money(ev.price);
      if(aucEnded&&aucEnded.pos===ev.pos){ pushNews('auc',pickN(['Palu diketok! '+pn+' jatuh ke '+N+' di harga '+m,'Lelang '+pn+' dimenangkan '+N+' seharga '+m],q)); aucEnded=null; }
      else pushNews('buy',pickN([N+' borong '+pn+' seharga '+m,'Properti baru: '+pn+' resmi milik '+N,N+' memperluas kerajaan bisnis ke '+pn],q));
      break; }
    case 'RENT':{
      sfx.coinDown(); worldFx(ev.pos,['💸','🪙'],4); const F=nm(ev.from), T=nm(ev.to), m=money(ev.amount);
      pushNews('rent',ev.amount>=150?pickN(['Sewa jumbo! '+F+' bayar '+m+' ke '+T+' di '+pn,'Kantong '+T+' menebal: '+m+' dari '+F+' di '+pn],q):pickN([F+' menginap di '+pn+', sewa '+m+' mengalir ke '+T,T+' panen sewa '+m+' dari '+F+' ('+pn+')'],q));
      taunt(ev.from,'rent',q); break; }
    case 'TAX':{
      sfx.coinDown(); const label=ev.label||pn;
      pushNews('tax',pickN(['Kas negara bertambah: '+nm(ev.player)+' setor '+money(ev.amount)+' ('+label+')',nm(ev.player)+' tak lolos dari '+label+': '+money(ev.amount)],q));
      taunt(ev.player,'tax',q); break; }

      else{ sfx.card(); pushNews('card',nm(ev.player)+' menarik kartu '+(ev.deck==='chance'?'Kesempatan':'Dana Umum')+': '+ev.text); }
      break;
    case 'CASH':
      if(ev.amount>0) sfx.coinUp(); else sfx.coinDown();
      if(ev.amount<0&&ev.reason==='card') taunt(ev.player,'cardloss',q);
      else if(ev.amount<0&&ev.reason==='fine') taunt(ev.player,'fine',q);

    case 'MOVED':
      if(ev.reason==='swap') sfx.swap();

    case 'JAIL_FAIL': taunt(ev.player,'jailfail',q); break;

    case 'REDEEM': sfx.coinDown(); pushNews('deal',nm(ev.player)+' menebus '+pn+' dari gadai'); break;

    case 'XFER':
      sfx.coinDown();
      if(ev.kind==='steal'){ taunt(ev.from,'robbed',q); pushNews('card',nm(ev.to)+' mengambil '+money(ev.amount)+' dari '+nm(ev.from)+' lewat kartu curang'); }

/* ---------- Presenter: plays confirmed events one at a time; never decides outcomes ---------- */
class Presenter{
  constructor(){ this.queue=[]; this.busy=false; this.activity=''; this.skip=false; }
  push(ev){ this.queue.push(ev); renderDock(); if(!this.busy) this.run(); }
  async run(){
    this.busy=true; const mine=session;
    while(this.queue.length){
      if(this.queue.length>24){ for(const e of this.queue) reduce(view,e); this.queue.length=0; syncTokens(); renderAll(); hideCard(); break; }  /* long gap: snap to confirmed state */
      const n=this.queue.length;
      ticker.scale=this.skip?10:n>10?4:n>5?2.2:n>3?1.5:1;
      const ev=this.queue.shift();
      try{ await play(ev); }catch(err){ console.error(err); reduce(view,ev); renderAll(); }
      if(mine!==session) return;
    }
    this.busy=false; this.activity=''; this.skip=false; ticker.scale=1; renderDock();
  }
}

class Net{

  lat(){ const b=settings.latency; return b?b*(.7+Math.random()*.6):0; }
  later(fn,ms){ if(ms<=0) Promise.resolve().then(fn); else setTimeout(fn,ms); }
  deliver(ev,ms){ this.later(()=>{ if(!this.dead&&this.online) this.onEvent(JSON.parse(JSON.stringify(ev))); },ms); }
  fromServer(ev){
    if(this.dead||!this.online) return;
    let at=this.lat();
    if(settings.chaos){ if(Math.random()<.35) at+=Math.random()*700; if(Math.random()<.15) this.deliver(ev,at+Math.random()*400); }
    else{ const now=performance.now(); at=Math.max(at,this.lastAt-now+1); this.lastAt=now+at; }   /* ordered like a websocket unless chaos is on */
    this.deliver(ev,at);
  }
  send(action){
    action.id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    return new Promise(resolve=>{
      let done=false;
      const attempt=()=>{
        if(done||this.dead) return;
        if(!this.online){ this.waiting.push(attempt); return; }
        this.later(()=>{ const ack=this.server.submit(action); this.later(()=>{ if(this.online&&!done){ done=true; resolve(ack); } },this.lat()); },this.lat());
      };
      attempt();
      const retry=()=>{ if(done||this.dead) return; attempt(); setTimeout(retry,3500); };
      setTimeout(retry,3500);
    });
  }
  resync(){
    if(this.syncing||this.dead) return; this.syncing=true; renderNet();
    this.later(()=>{
      if(!this.online){ this.syncing=false; renderNet(); return; }
      this.server.eventsSince(buffer.next-1).forEach(e=>this.onEvent(e));
      this.syncing=false; renderNet();
    },this.lat()+120);
  }
  ping(){ this.later(()=>{ if(this.online&&this.server.state.seq>buffer.next-1) this.resync(); },this.lat()); }
  disconnect(ms){
    if(!this.online) return; this.online=false; renderNet(); renderDock();
    setTimeout(()=>{ if(this.dead) return; this.online=true; const w=this.waiting; this.waiting=[]; w.forEach(f=>f()); this.resync(); renderNet(); renderDock(); },ms);
  }
}
class Bots{
  constructor(server,ids){ this.server=server; this.ids=ids; this.timer=0; this.budget=0; this.dead=false; server.subscribe(ev=>{ this.budget+=presentMs(ev); clearTimeout(this.timer); this.timer=setTimeout(()=>this.think(),clamp(this.budget*.8+600,900,6000)); }); }
  manage(s,p){
    const pl=s.players[p], mine=ownedBy(s,p);
    for(const i of mine) if(s.mort[i]&&pl.cash>redeemCost(s,i)+300) return {type:'REDEEM',pos:i};
    return null;
  }
  think(){
    if(this.dead) return; this.budget=0;
    const s=this.server.state; if(s.winner!=null) return;
    const p=(s.phase==='auction'&&s.auction)?this.ids.find(i=>s.auction.active.indexOf(i)>=0&&s.auction.bidder!==i):s.turn; if(p==null||this.ids.indexOf(p)<0) return;
    const pl=s.players[p]; let a;
    if(s.phase==='auction'){ const A=s.auction, nb=A.bid+10, val=BOARD[A.pos].price*(0.75+((p*37+A.pos*11)%5)*0.08);
      a=(nb<=val&&nb<=pl.cash-100)?{type:'BID',amount:nb}:{type:'PASS_BID'}; }
    else if(s.phase==='roll'){
      if(pl.jail&&s.jailCards[p]) a={type:'JAIL_CARD'}; else if(pl.jail&&pl.cash>600) a={type:'JAIL_PAY'};
      else if(pl.cash<100&&!this.server.validate({type:'AID',player:p})) a={type:'AID'}; else a={type:'ROLL'}; }
    else if(s.phase==='offer') a={type:s.players[p].cash-s.offer.price>=150?'BUY':'DECLINE'};
    else if(s.phase==='upgrade') a={type:pl.cash-s.offer.price>=200?'UPGRADE':'SKIP'};
    else if(s.phase==='takeover') a=pl.cash-s.offer.price>=400?{type:'TAKE_PROPOSE',pos:s.offer.pos,price:s.offer.price}:{type:'SKIP'};
    else if(s.phase==='end') a=this.manage(s,p)||{type:'END_TURN'}; else return;
    a.player=p; a.id='bot'+p+'-'+s.seq; this.server.submit(a);

}

const ptrs=new Map(); let drag=null, pinch=null;
function stageInit(){
  const st=$('#stage');

  st.addEventListener('pointerdown',e=>{
    if(e.target.closest('.ctrl,.auc')) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); st.setPointerCapture(e.pointerId);

    if(ptrs.size===2&&pinch){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); freeCam(); cam.s=clamp(pinch.s*d/pinch.d,.3,2.2); return; }

    if(ptrs.size<2) pinch=null; if(ptrs.size===0) drag=null;

  st.addEventListener('wheel',e=>{ e.preventDefault(); freeCam(); cam.s=clamp(cam.s*Math.exp(-e.deltaY*.0015),.3,2.2); },{passive:false});
  st.addEventListener('keydown',e=>{
    const step=C*.6/cam.s*cam.s; const k=e.key;
    if(k==='ArrowLeft'){freeCam();cam.x-=step;} else if(k==='ArrowRight'){freeCam();cam.x+=step;}

    e.preventDefault();

/* ---------- Online: room, transport, lobby ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const store=(()=>{ try{ sessionStorage.setItem('_t','1'); return sessionStorage; }catch(e){ const m={}; return {getItem:k=>m[k]||null,setItem:(k,v)=>{m[k]=v;},removeItem:k=>{delete m[k];}}; } })();
const ROOM={host:false,started:false,code:'',pid:'',name:'',at:0,seats:[],ch:null,sb:null,
  send(m){ if(this.ch) this.ch.send({type:'broadcast',event:'m',payload:m}); }};
const vErr=a=>GameServer.prototype.validate.call({state:truth,tradeErr:GameServer.prototype.tradeErr},a);
class HostNet{
  constructor(){ this.online=true; this.dead=false; this.syncing=false;
    server.subscribe(ev=>{ if(this.dead) return; buffer.push(clone(ev)); ROOM.send({t:'ev',ev}); }); }
  send(action){ action.id=uid(); return Promise.resolve(server.submit(action)); }
  resync(){} ping(){}
}
class GuestNet{
  constructor(){ this.online=true; this.dead=false; this.syncing=false; this.pend=new Map(); }
  send(action){
    action.id=uid();
    return new Promise(res=>{
      let done=false; this.pend.set(action.id,ack=>{ done=true; res(ack); });
      const go=()=>{ if(!done&&!this.dead) ROOM.send({t:'act',pid:ROOM.pid,a:action}); };
      go(); const retry=()=>{ if(done||this.dead) return; go(); setTimeout(retry,3500); }; setTimeout(retry,3500);
    });
  }
  onAck(m){ const f=this.pend.get(m.id); if(f){ this.pend.delete(m.id); f(m.ack); } }
  resync(){ if(this.syncing||this.dead) return; this.syncing=true; renderNet(); ROOM.send({t:'sync',pid:ROOM.pid,seq:buffer.next-1}); setTimeout(()=>{ this.syncing=false; renderNet(); },1200); }
  ping(){}
}
function idleBoard(){
  truth=createState(NAMES,ROUNDS); view=clone(truth); presenter=new Presenter(); buffer=new EventBuffer(0,()=>{});
  net={online:true,syncing:false,send(){ return new Promise(()=>{}); },resync(){},ping(){}};
  buildBoard(); buildPlayers(); buildDice(); syncTokens(); cam.focus=0; cam.snap=true; setCamMode('overview'); renderAll(); renderNet(); resize();

function hostRestart(){ if(!ROOM.host){ say('Hanya host yang bisa memulai permainan baru.'); return; } ROOM.send({t:'restart'}); startSession(); }
function renderTradeModal(){
  const o=view.tradeOffer, m=$('#tmodal'), show=!!o&&o.to===ME&&view.winner==null;
  if(!show){ m.hidden=true; return; }

  const b=$('#tmBody'); b.textContent='';
  const ln=(t,ks)=>b.append(h('div',{class:'row'},h('span',{class:'rn',text:t}),h('span',{class:'ro',text:ks.length?ks.map(k=>BOARD[k].name).join(', '):'tidak ada'})));
  ln('Kamu dapat',o.give); ln('Kamu beri',o.get);
  b.append(h('div',{class:'row'},h('span',{class:'rn',text:o.cash>0?'Kamu terima':'Kamu bayar'}),h('span',{class:'ro',text:money(Math.abs(o.cash))})));
}
function beginGame(seats){
  ROOM.seats=seats; ROOM.started=true; NAMES=seats.map(s=>s.name); ME=seats.findIndex(s=>s.pid===ROOM.pid);
  $('#lobby').hidden=true; startSession();
}
function onRoomMsg(m){
  if(!m) return;
  if(m.t==='start'){ if(!ROOM.host&&!ROOM.started&&m.seats.some(s=>s.pid===ROOM.pid)) beginGame(m.seats); return; }
  if(m.t==='restart'){ if(!ROOM.host&&ROOM.started) startSession(); return; }
  if(!ROOM.started) return;
  if(ROOM.host){
    const seat=ROOM.seats.findIndex(s=>s.pid===m.pid); if(seat<0) return;
    if(m.t==='act'){ if(m.a.player!==seat) return; const ack=server.submit(m.a); ROOM.send({t:'ack',to:m.pid,id:m.a.id,ack}); }
    else if(m.t==='sync'){ const evs=server.eventsSince(m.seq); for(let i=0;i<evs.length;i+=40) ROOM.send({t:'evs',to:m.pid,evs:evs.slice(i,i+40)}); }
  }else{
    if(m.t==='ev') buffer.push(m.ev);
    else if(m.t==='hb'){ if(m.seq>buffer.next-1) net.resync(); }
    else if(m.to===ROOM.pid){ if(m.t==='evs') m.evs.forEach(e=>buffer.push(e)); else if(m.t==='ack') net.onAck(m); }
  }
}
const leaveT={};
function onLeave(key){
  if(!ROOM.host||!ROOM.started||key===ROOM.pid) return;
  const i=ROOM.seats.findIndex(s=>s.pid===key); if(i<0||view.players[i].out) return;
  say(NAMES[i]+' terputus. Menunggu 60 detik sebelum dianggap menyerah.');
  leaveT[key]=setTimeout(()=>{ server.forfeit(i); server.flush(); },60000);
}
function onJoin(key){ if(leaveT[key]){ clearTimeout(leaveT[key]); delete leaveT[key]; say('Seorang pemain tersambung kembali.'); } }
function roomPlayers(){
  const st=ROOM.ch.presenceState();
  return Object.keys(st).map(k=>Object.assign({pid:k},st[k][st[k].length-1])).sort((a,b)=>(b.host?1:0)-(a.host?1:0)||a.at-b.at);
}
function lbMsg(t){ $('#lbMsg').textContent=t||''; }
function lobbyRender(){
  if(ROOM.started||!ROOM.ch) return;
  const ps=roomPlayers(), host=ps.find(p=>p.host), me=ps.findIndex(p=>p.pid===ROOM.pid);
  $('#lbEnter').hidden=true; $('#lbRoom').hidden=false; $('#lbCodeShow').textContent=ROOM.code;
  const l=$('#lbList'); l.textContent='';
  ps.slice(0,4).forEach((p,i)=>l.append(h('div',{class:'row'},h('span',{class:'rn',text:p.name+(p.pid===ROOM.pid?' (kamu)':'')}),h('span',{class:'ro',text:p.host?'Host':'Pemain '+(i+1)}))));
  $('#lbStart').hidden=!ROOM.host; $('#lbStart').disabled=ps.length<2; $('#lbWait').hidden=ROOM.host;

    if(host.seats&&host.seats.some(s=>s.pid===ROOM.pid)) beginGame(host.seats); else lbMsg('Room ini sudah dimulai.');
  }else if(me>=4) lbMsg('Room penuh (maksimal 4 pemain).'); else lbMsg('');
}
function leaveRoom(msg){
  if(ROOM.ch){ try{ ROOM.ch.unsubscribe(); }catch(e){} } ROOM.ch=null; store.removeItem('tw_room');
  $('#lbEnter').hidden=false; $('#lbRoom').hidden=true; lbMsg(msg);
}
function enterRoom(code,host,name){
  ROOM.host=host; ROOM.code=code; ROOM.name=name; ROOM.at=Date.now(); lbMsg('Menghubungkan…');
  if(!host) store.setItem('tw_room',code);
  ROOM.sb=ROOM.sb||supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const ch=ROOM.sb.channel('monopolex-'+code,{config:{presence:{key:ROOM.pid},broadcast:{self:false}}}); ROOM.ch=ch;
  ch.on('broadcast',{event:'m'},p=>onRoomMsg(p.payload));
  ch.on('presence',{event:'sync'},lobbyRender);
  ch.on('presence',{event:'join'},p=>onJoin(p.key));
  ch.on('presence',{event:'leave'},p=>onLeave(p.key));
  ch.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      await ch.track({name,host,at:ROOM.at,started:false}); lbMsg('');
      if(net&&ROOM.started){ net.online=true; renderNet(); renderDock(); if(!host) net.resync(); }
      if(!host&&!ROOM.started) setTimeout(()=>{ if(ROOM.ch===ch&&!ROOM.started&&!roomPlayers().some(p=>p.host)) leaveRoom('Room tidak ditemukan. Cek kodenya lalu coba lagi.'); },3500);
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
      if(net&&ROOM.started){ net.online=false; renderNet(); renderDock(); } else lbMsg('Masalah koneksi. Mencoba lagi…');
    }
  });
}
function initLobby(){
  try{ ROOM.pid=store.getItem('tw_pid'); }catch(e){} if(!ROOM.pid){ ROOM.pid=uid(); store.setItem('tw_pid',ROOM.pid); }
  const nameEl=$('#lbName'); try{ nameEl.value=localStorage.getItem('tw_name')||''; }catch(e){}
  const ok=window.supabase&&!/PASTE/.test(SUPABASE_URL+SUPABASE_ANON_KEY);
  if(!ok) lbMsg('Supabase belum diatur. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas script.');
  const nm0=()=>{ const n=nameEl.value.trim()||'Pemain'; try{ localStorage.setItem('tw_name',n); }catch(e){} return n; };
  const alpha='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  $('#lbCreate').onclick=()=>{ if(!ok) return; let c=''; const r=new Uint32Array(5); (window.crypto||{getRandomValues:a=>a.forEach((_,i)=>{a[i]=Math.random()*4e9;})}).getRandomValues(r); r.forEach(x=>{ c+=alpha[x%alpha.length]; }); enterRoom(c,true,nm0()); };
  const join=()=>{ if(!ok) return; const c=$('#lbCode').value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(c.length!==5){ lbMsg('Masukkan kode room 5 karakter.'); return; } enterRoom(c,false,nm0()); };
  $('#lbJoin').onclick=join; $('#lbCode').addEventListener('keydown',e=>{ if(e.key==='Enter') join(); });
  $('#lbCopy').onclick=()=>{ const u=location.origin+location.pathname+'?room='+ROOM.code; if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>lbMsg('Link undangan tersalin.'),()=>lbMsg(u)); else lbMsg(u); };
  $('#lbStart').onclick=()=>{
    const ps=roomPlayers().slice(0,4); if(ps.length<2) return; const used={};
    const seats=ps.map(p=>{ let n=p.name||'Pemain'; if(used[n]) n+=' '+(++used[n]); else used[n]=1; return {pid:p.pid,name:n}; });
    ROOM.ch.track({name:ROOM.name,host:true,at:ROOM.at,started:true,seats}); ROOM.send({t:'start',seats}); beginGame(seats);
  };
  const q=new URLSearchParams(location.search).get('room'); if(q) $('#lbCode').value=q.toUpperCase().slice(0,5);
  const saved=store.getItem('tw_room'); if(ok&&saved&&!q) enterRoom(saved,false,nm0());
}
/* ---------- Wiring ---------- */
function onPrimary(){
  const now=performance.now(); if(now-lastTap<400) return; lastTap=now;       /* ignore accidental double taps */
  if(truth.winner!=null&&synced()){ hostRestart(); return; }
  const a=currentAction(); if(!a||actionLock) return;
  sendAction(a);
}
function onSecondary(){
  const now=performance.now(); if(now-lastTap<400) return; lastTap=now;
  const a=currentAction();
  if(a&&a.alt&&!actionLock) sendAction(a.alt);
  else if(presenter.busy){ presenter.skip=true; ticker.scale=10; }
}
function sendAction(act){
  actionLock={seq:truth.seq,at:performance.now()}; renderDock();
  const s=session;
  net.send(Object.assign({},act,{player:ME})).then(ack=>{
    if(s!==session) return;
    if(!ack.ok){ actionLock=null; say(ack.error); renderDock(); net.resync(); }
  });
}
document.addEventListener('DOMContentLoaded',()=>{
  stageInit();
  $('#btnPrimary').onclick=onPrimary; $('#btnSecondary').onclick=onSecondary;
  document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>({assets:openAssets,deals:openDeals,log:openLog,menu:openMenu})[b.dataset.sheet]());
  $('#sheetClose').onclick=closeSheet; $('#scrim').onclick=closeSheet;
  $('#sheetBack').onclick=()=>{ if(sheetBackFn) sheetBackFn(); };
  $('#mAgain').onclick=()=>hostRestart();
  $('#tmYes').onclick=()=>sendAction({type:'TRADE_REPLY',accept:true}); $('#tmNo').onclick=()=>sendAction({type:'TRADE_REPLY',accept:false});
  $('#kmYes').onclick=()=>{ $('#kmodal').hidden=true; sendAction({type:'TAKE_REPLY',accept:true}); }; $('#kmNo').onclick=()=>{ $('#kmodal').hidden=true; sendAction({type:'TAKE_REPLY',accept:false}); };
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&sheetOpen) closeSheet();
    else if((e.key==='r'||e.key==='R')&&!sheetOpen&&!e.metaKey&&!e.ctrlKey&&!e.target.closest('input,select,textarea')){ const p=$('#btnPrimary'); if(!p.disabled) p.click(); }
  });
  /* drag the sheet handle down to dismiss */
  const grab=$('#grab'); let gy=null;
  grab.addEventListener('pointerdown',e=>{ gy=e.clientY; grab.setPointerCapture(e.pointerId); $('#sheet').classList.add('drag'); });
  grab.addEventListener('pointermove',e=>{ if(gy!=null) $('#sheet').style.transform='translateY('+Math.max(0,e.clientY-gy)+'px)'; });
  const gend=e=>{ if(gy==null) return; const dy=e.clientY-gy; gy=null; $('#sheet').classList.remove('drag'); if(dy>90) closeSheet(); else $('#sheet').style.transform=''; };
  grab.addEventListener('pointerup',gend); grab.addEventListener('pointercancel',gend);
  /* main loop */
  let last=0, ema=16, slow=0;
  function frame(now){
    requestAnimationFrame(frame);
    const raw=last?now-last:16; last=now; const dt=Math.min(raw,50);
    stepTweens(dt*ticker.scale); camUpdate(dt); renderTokens(); tickAuction();
    if(ticker.list.length&&!document.hidden){

      if(ema>34&&!settings.lite){ if(++slow>150){ settings.lite=true; applySettings(); say('Efek dikurangi supaya tetap lancar.'); } } else slow=Math.max(0,slow-1);
    }
  }
  idleBoard(); initLobby();       /* build the board first, then start the frame loop */
  requestAnimationFrame(frame);
