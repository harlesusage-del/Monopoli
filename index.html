<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08120f">
<title>Tidewater</title>
<style>
:root{
  --bg0:#071013; --ink:#eaf3f1; --ink2:#aec3bf; --line:rgba(255,255,255,.15);
  --glass:rgba(255,255,255,.075); --solid:rgba(20,34,40,.95);
  --accent:#e9b872; --sea:#6fd1c3; --danger:#f59a8f; --ok:#9be3a5;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 70% at 0% 0%,#14363d 0%,transparent 58%),
    radial-gradient(90% 60% at 100% 100%,#2b2314 0%,transparent 55%),
    var(--bg0);
  color:var(--ink);font:15px/1.35 var(--sans);overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
h2{margin:0;font:600 19px/1.2 var(--serif)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Glass ---------- */
.glass{
  position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.17),0 10px 28px rgba(0,0,0,.35);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,0) 36%)}
.glass>*{position:relative;z-index:1}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:var(--solid)}
}
.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--solid);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.lite .glass::before{display:none}
.lite .tk-sh{filter:none}

/* ---------- Layout ---------- */
.app{position:fixed;inset:0;display:grid;gap:8px;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px);
  grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"players" "stage" "dock"}
.players{grid-area:players;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stage{grid-area:stage;position:relative;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--line);
  background:#0a171b;touch-action:none;contain:layout paint;min-height:0;outline-offset:-3px}
.dock{grid-area:dock;padding:12px;display:grid;gap:10px}
@media (orientation:landscape) and (min-width:640px){
  .app{grid-template-columns:minmax(0,1fr) 316px;grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"stage players" "stage dock"}
  .players{grid-template-columns:1fr 1fr}
  .dock{align-self:end}
}
@media (orientation:landscape) and (min-width:640px) and (min-height:620px){
  .players{grid-template-columns:1fr}
}

/* ---------- Player chips ---------- */
.chip{padding:7px 8px;display:flex;align-items:center;gap:7px;border-radius:var(--r-md);min-width:0;transition:border-color .2s,background .2s}
.chip .av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pc);color:#10171a;display:grid;place-items:center;font:700 13px var(--serif);border:2px solid rgba(255,255,255,.8)}
.chip .cm{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.chip .nm{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cash{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:5.4em}
.chip .meta{display:none;font-size:11px;color:var(--ink2)}
.chip .tag{position:absolute;top:-8px;right:6px;z-index:2;padding:1px 7px;border-radius:999px;background:var(--accent);color:#1a1306;font-size:10.5px;font-weight:700;display:none}
.chip.active{border-color:var(--accent);background:rgba(233,184,114,.14);box-shadow:0 0 0 1px var(--accent),inset 0 1px 0 rgba(255,255,255,.2)}
.chip.active .tag{display:block}
.chip.out{opacity:.55;border-style:dashed}
.chip.out .tag{display:block;background:var(--danger)}
.chip .delta{position:absolute;left:10px;bottom:-14px;font-weight:700;font-size:12px;opacity:0;pointer-events:none;z-index:3;text-shadow:0 1px 4px #000;font-variant-numeric:tabular-nums}
.chip .delta.up{color:var(--ok)} .chip .delta.down{color:var(--danger)}
@media (min-width:640px) and (orientation:landscape){.chip .meta{display:block}.chip .nm{font-size:13px}.chip{padding:9px 10px}}

/* ---------- Board ---------- */
#world{position:absolute;left:0;top:0;width:968px;height:968px;transform-origin:0 0;will-change:transform}
.board{position:absolute;inset:0;border-radius:26px;
  background:radial-gradient(70% 70% at 50% 45%,#14272d 0%,#0b171b 70%);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.center{position:absolute;left:88px;top:88px;width:792px;height:792px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;
  border-radius:22px;background:linear-gradient(160deg,rgba(111,209,195,.07),rgba(233,184,114,.05));border:1px solid rgba(255,255,255,.07)}
.center b{font:600 74px/1 var(--serif);letter-spacing:.04em;color:rgba(234,243,241,.14)}
.center i{font:italic 22px var(--serif);color:rgba(234,243,241,.2)}
.cell{position:absolute;width:88px;height:88px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:10px;overflow:hidden;cursor:pointer;
  -webkit-user-select:none;user-select:none}
.cell .nm{font:600 11.5px/1.15 var(--serif)}
.cell .pr{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell .gl{font:600 24px/1 var(--serif);color:var(--accent)}
.cell .band{position:absolute;background:var(--gc)}
.edge-b{padding-top:22px}.edge-b .band{left:0;right:0;top:0;height:16px}
.edge-t{padding-bottom:22px}.edge-t .band{left:0;right:0;bottom:0;height:16px}
.edge-l{padding-right:22px}.edge-l .band{top:0;bottom:0;right:0;width:16px}
.edge-r{padding-left:22px}.edge-r .band{top:0;bottom:0;left:0;width:16px}
.cell.corner .nm{font-size:13px}
.own{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--pc);color:#10171a;font:700 11px/16px var(--serif);text-align:center;border:2px solid rgba(255,255,255,.85)}
.edge-b .own,.edge-r .own{right:4px;bottom:4px}.edge-t .own{right:4px;top:4px}.edge-l .own{left:4px;bottom:4px}
.cell.hot::after{content:"";position:absolute;inset:2px;border:2px solid var(--accent);border-radius:9px;animation:pulse 1.1s ease-out 3;pointer-events:none}
.cell.hot{background:rgba(233,184,114,.16)}
@keyframes pulse{0%{opacity:1;transform:scale(.94)}100%{opacity:.15;transform:scale(1.02)}}
.token{position:absolute;left:-15px;top:-15px;width:30px;height:30px;pointer-events:none;will-change:transform}
.tk{position:absolute;inset:0;border-radius:50%;background:var(--pc);color:#10171a;font:700 14px/26px var(--serif);text-align:center;
  border:2px solid rgba(255,255,255,.88);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 -4px 6px rgba(0,0,0,.18),inset 0 3px 4px rgba(255,255,255,.35)}
.tk-sh{position:absolute;left:5px;right:5px;bottom:-5px;height:8px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px)}
.token.mine .tk{outline:2px solid #fff;outline-offset:2px}

.bld{position:absolute;top:3px;left:5px;font-size:10px;font-weight:700;color:var(--accent);letter-spacing:1px;pointer-events:none}
.cell.mort{opacity:.45;filter:saturate(.3)}
.pill{white-space:nowrap}
/* ---------- Stage overlays ---------- */
.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 20px);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px;text-align:center;opacity:0;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dice{position:absolute;top:54px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .22s}
.dice.show{opacity:1}
.die{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#fdfaf2,#d9d3c3);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 -2px 3px rgba(0,0,0,.12)}
.pip{width:7px;height:7px;border-radius:50%;background:#1a2326;opacity:0;place-self:center}.pip.on{opacity:1}
.dsum{font:700 15px var(--sans);font-variant-numeric:tabular-nums;min-width:4.6em;text-align:left}
.ctrl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;pointer-events:none}
.ctrl>*{pointer-events:auto}
.ctrl .sp{flex:1;pointer-events:none}
.pill{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pill.off .dot{background:var(--danger)} .pill.sync .dot{background:var(--accent)}
.sq{min-width:44px;min-height:44px;border-radius:14px;padding:0 12px;font-weight:700;font-size:13px;border:1px solid var(--line)}
.card{position:absolute;left:10px;right:10px;bottom:66px;margin:auto;max-width:430px;padding:12px 14px 12px 22px;display:flex;gap:12px;align-items:center;overflow:hidden}
.card[hidden]{display:none}
.card .cband{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--gc,var(--accent));z-index:1}
.card .ctitle{font:600 17px/1.2 var(--serif)}
.card .cbody{font-size:13.5px;color:var(--ink2);margin-top:2px}
.card.danger{border-color:var(--danger)}

/* ---------- Buttons / dock ---------- */
.btn{min-height:48px;padding:0 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.09);font-weight:650;transition:transform .12s ease,background .15s ease,opacity .15s ease}
.btn:active{transform:scale(.97)}
.btn.small{min-height:44px;padding:0 14px;border-radius:14px}
.btn.primary{background:linear-gradient(180deg,#f3cb8f,#dca25a);color:#1a1306;border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px rgba(233,184,114,.22)}
.btn[disabled]{opacity:.62;cursor:default;border-style:dashed;transform:none;box-shadow:none}
.btn[hidden]{display:none}
.dock-msg .t{font:600 18px/1.2 var(--serif)}
.dock-msg .s{color:var(--ink2);font-size:13.5px;margin-top:2px;min-height:1.35em}
.dock-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.dock-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dock-nav .btn{min-height:44px;font-weight:600;font-size:13.5px;background:rgba(255,255,255,.05)}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,8,9,.5);opacity:0;visibility:hidden;transition:opacity .28s,visibility 0s .28s;z-index:20}
.scrim.open{opacity:1;visibility:visible;transition-delay:0s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,560px);max-height:80dvh;max-height:80vh;z-index:21;border-radius:26px 26px 0 0;
  padding:8px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column;visibility:hidden;transform:translateY(110%);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s;background:rgba(18,32,38,.82)}
.sheet.open{visibility:visible;transform:none;transition-delay:0s}
.sheet.drag{transition:none}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:4px auto 8px;touch-action:none;position:relative}
.grab::after{content:"";position:absolute;left:-40px;right:-40px;top:-14px;bottom:-14px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h2{flex:1;min-width:0}
.sheet-body{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.hero{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:10px}
.swatch{flex:none;width:14px;align-self:stretch;border-radius:7px;background:var(--gc)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:6px 0;font-size:14px}
.kv span:nth-child(odd){color:var(--ink2)} .kv span:nth-child(even){font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.list{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left;width:100%}
.row .sw{flex:none;width:10px;height:26px;border-radius:5px;background:var(--gc)}
.row .rn{flex:1;min-width:0}
.row .ro{font-size:12.5px;color:var(--ink2)}
.h3{font-weight:700;margin:12px 0 6px;font-size:13px;color:var(--ink2)}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.sw-row small{display:block;color:var(--ink2);font-size:12.5px}
.toggle{min-width:76px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700}
.toggle[aria-checked="true"]{background:var(--sea);color:#06201c;border-color:transparent}
.log{display:grid;gap:4px;font-size:13.5px}.log div{padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
select{min-height:44px;border-radius:12px;background:#142329;color:var(--ink);border:1px solid var(--line);padding:0 10px;font:inherit}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(3,8,9,.62);opacity:0}
.modal[hidden]{display:none}
.modal .box{width:min(100%,420px);padding:22px;text-align:center}
.modal h2{font-size:28px;margin-bottom:6px}
.modal .res{margin:14px 0;display:grid;gap:6px;text-align:left}

/* ---------- Reduced motion / effects ---------- */
.rm *,.rm *::before,.rm *::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.inp{width:100%;min-height:48px;border-radius:14px;background:#142329;color:var(--ink);border:1px solid var(--line);padding:0 12px;font:inherit}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="players" id="players" aria-label="Players"></header>

  <main class="stage" id="stage" tabindex="0" aria-label="Game board. Drag to pan, pinch or use plus and minus to zoom, arrow keys to move.">
    <div id="world"></div>
    <div class="banner glass" id="banner" role="status" aria-live="polite"></div>
    <div class="dice glass" id="dice" aria-hidden="true">
      <div class="die" id="die0"></div><div class="die" id="die1"></div><div class="dsum" id="dsum"></div>
    </div>
    <div class="card glass" id="card" hidden></div>
    <div class="ctrl">
      <div class="pill glass" id="net"><span class="dot"></span><span id="netText">Live</span></div>
      <div class="pill glass" id="gov"><span id="govText"></span></div>
      <span class="sp"></span>
      <button class="sq glass" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="sq glass" id="zoomIn" aria-label="Zoom in">+</button>
      <button class="sq glass" id="camMode">Overview</button>
    </div>
  </main>

  <footer class="dock glass" id="dock">
    <div class="dock-msg"><div class="t" id="dockTitle"></div><div class="s" id="dockSub"></div></div>
    <div class="dock-actions">
      <button class="btn primary" id="btnPrimary" disabled>Please wait</button>
      <button class="btn" id="btnSecondary" hidden>Pass</button>
    </div>
    <nav class="dock-nav" aria-label="Game menus">
      <button class="btn" data-sheet="assets">Assets</button>
      <button class="btn" data-sheet="deals">Deals</button>
      <button class="btn" data-sheet="log">Log</button>
      <button class="btn" data-sheet="menu">Settings</button>
    </nav>
  </footer>
</div>

<div class="modal" id="lobby" style="opacity:1;z-index:40;background:rgba(3,8,9,.88)">
  <div class="box glass">
    <h2>Tidewater</h2><div style="color:var(--ink2);margin-bottom:14px">Play online with friends</div>
    <div id="lbEnter">
      <input id="lbName" class="inp" maxlength="14" placeholder="Your name" autocomplete="off">
      <button class="btn primary" id="lbCreate" style="width:100%;margin-top:10px">Create room</button>
      <div style="color:var(--ink2);margin:14px 0 6px">or join with a room code</div>
      <div style="display:flex;gap:8px"><input id="lbCode" class="inp" maxlength="5" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:.25em;text-align:center"><button class="btn" id="lbJoin">Join</button></div>
    </div>
    <div id="lbRoom" hidden>
      <div style="color:var(--ink2)">Room code</div>
      <div id="lbCodeShow" style="font:700 42px var(--serif);letter-spacing:.2em;margin:4px 0 8px"></div>
      <button class="btn small" id="lbCopy">Copy invite link</button>
      <div class="res" id="lbList"></div>
      <button class="btn primary" id="lbStart" style="width:100%">Start game</button>
      <div id="lbWait" style="color:var(--ink2)">Waiting for the host to start…</div>
    </div>
    <div id="lbMsg" style="color:var(--danger);margin-top:10px;min-height:1.3em"></div>
  </div>
</div>
<div class="modal" id="tmodal" hidden style="z-index:26"><div class="box glass"><h2 id="tmTitle" style="font-size:22px"></h2><div class="res" id="tmBody"></div>
  <div style="display:flex;gap:8px"><button class="btn primary" id="tmYes" style="flex:1">Accept</button><button class="btn" id="tmNo" style="flex:1">Decline</button></div></div></div>
<div class="scrim" id="scrim"></div>
<section class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grab" id="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <button class="btn small" id="sheetBack" hidden>Back</button>
    <h2 id="sheetTitle"></h2>
    <button class="btn small" id="sheetClose">Close</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box glass">
    <h2 id="mTitle"></h2><div id="mSub" style="color:var(--ink2)"></div>
    <div class="res" id="mRes"></div>
    <button class="btn primary" id="mAgain" style="width:100%">New game</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

      const w=a.bidder, pos=a.pos, price=a.bid, t=s.turn;
      this.emit({type:'AUC_END'});
      if(w!=null) this.emit({type:'BOUGHT',player:w,pos,price}); else this.emit({type:'NOTE',text:'No bids. '+BOARD[pos].name+' stays with the bank.'});
      this.finish(t);
    }
  }
  forfeit(p){
    const s=this.state; if(s.winner!=null||s.players[p].out) return;
    const wasTurn=s.turn===p, vote=s.phase==='vote';
    if(s.auction&&wasTurn) this.emit({type:'AUC_END'});
    else if(s.auction&&s.auction.active.indexOf(p)>=0) this.emit({type:'AUC_PASS',player:p,text:this.name(p)+' left the auction'});
    this.emit({type:'BANKRUPT',player:p,creditor:null});
    const al=this.alive(); if(al.length===1){ this.emit({type:'GAME_OVER',winner:al[0].id}); return; }
    if(s.tradeOffer&&(s.tradeOffer.from===p||s.tradeOffer.to===p)) this.emit({type:'TRADE_CLEAR'});
    if(s.auction) this.aucCheck();
    if(vote){ this.voteCheck(); return; }
    if(wasTurn&&s.phase!=='over') this.nextTurn(p);
  }
  doUpgrade(p,pos){
    const s=this.state, lv=(s.builds[pos]||0)+1;
    this.emit({type:'BUILD',player:p,pos,cost:buildCost(s,pos),permit:permitFee(s,pos),text:this.name(p)+' upgraded '+BOARD[pos].name+' to '+(lv===3?'Landmark · now permanent':'Lv '+lv)});
    if(!this.offerUpgrade(p,pos)) this.finish(p);
  }
  offerUpgrade(p,pos){ const s=this.state; if(buildErr(s,p,pos)) return false;
    this.emit({type:'OFFER2',kind:'upgrade',player:p,pos,price:buildCost(s,pos)+permitFee(s,pos)}); return true; }
  afterRent(p,pos){
    const s=this.state; if(BOARD[pos].type!=='prop'||(s.builds[pos]||0)>=3||s.mort[pos]) return 'done';
    const price=takeoverPrice(s,pos); if(s.players[p].cash<price) return 'done';
    this.emit({type:'OFFER2',kind:'takeover',player:p,pos,price}); return 'wait';
  }
  tradeErr(a){
    const s=this.state, p=a.player, w=a.with, give=a.give||[], get=a.get||[], cash=Math.round(+a.cash||0);
    if(!s.players[w]||w===p||s.players[w].out) return 'Choose another player.';
    if(!give.length&&!get.length) return 'Pick at least one property.';
    if(give.some(k=>s.owners[k]!==p||s.builds[k]===3)||get.some(k=>s.owners[k]!==w||s.builds[k]===3)) return 'Landmarks and unowned properties cannot be traded.';
    if((cash>0&&cash>s.players[p].cash)||(cash<0&&-cash>s.players[w].cash)) return 'Not enough cash for that deal.';
    return null;
  }
  trade(a){
    const s=this.state, p=a.player, w=a.with, give=a.give||[], get=a.get||[], cash=Math.round(+a.cash||0);
    const val=k=>propValue(s,k)*(s.mort[k]?.6:1);
    const rec=give.reduce((x,k)=>x+val(k),0)+cash, lose=get.reduce((x,k)=>x+val(k),0);
    if(rec>=lose*1.1&&rec>0) this.emit({type:'TRADE',player:p,with:w,give,get,cash,text:this.name(w)+' accepted the trade with '+this.name(p)});
    else this.emit({type:'NOTE',text:this.name(w)+' declined the trade.'});
  }
  callVote(){
    const s=this.state, al=this.alive(), ws=al.map(x=>worthOf(s,x.id)), avg=ws.reduce((x,y)=>x+y,0)/ws.length, votes={};
    this.emit({type:'VOTE_START',votes,text:'Vote: end the game now?'});
    this.voteCheck();
  }
  voteCheck(){
    const s=this.state, v=s.vote; if(!v) return;
    const al=this.alive(); if(al.some(pl=>v.votes[pl.id]===undefined)) return;
    const e=al.filter(pl=>v.votes[pl.id]==='end').length;
    if(e*2>al.length){ this.emit({type:'VOTE_END',ret:v.ret,text:'Most players voted to end the game.'}); this.endByWorth('vote'); }
    else{ this.emit({type:'VOTE_END',ret:v.ret,text:'The vote failed. Play on.'}); if(s.players[s.turn].out&&s.phase!=='over') this.nextTurn(s.turn); }
  }
  endByWorth(r){
    const s=this.state, sc=i=>[worthOf(s,i),s.players[i].cash,ownedBy(s,i).filter(k=>!s.mort[k]).reduce((x,k)=>x+BOARD[k].price,0)];
    const ids=this.alive().map(x=>x.id).sort((a,b)=>{ const x=sc(a),y=sc(b); return (y[0]-x[0])||(y[1]-x[1])||(y[2]-x[2]); });
    this.emit({type:'GAME_OVER',winner:ids[0],reason:r||'time'});
  }
  finish(p){
    const s=this.state, pl=s.players[p];
    this.emit({type:'PHASE',phase:(s.doubles>0&&pl.jail===0&&!pl.out)?'roll':'end'});
  }
  roll(p){
    const s=this.state, pl=s.players[p];
    const d1=this.die(), d2=this.die(), dbl=d1===d2, from=pl.pos;
    if(pl.jail>0){
      if(dbl){ this.emit({type:'FREED',player:p,reason:'doubles'}); return this.moveByRoll(p,d1,d2,0); }
      const left=pl.jail-1;
      if(left>0){
        this.emit({type:'DICE_ROLLED',player:p,d1,d2,from,to:from,path:[],doubles:0,passedGo:false});
        this.emit({type:'JAIL_FAIL',player:p,left});
        return this.finish(p);
      }
      this.emit({type:'FREED',player:p,reason:'fine'});
      if(!this.charge(p,50,null,'fine')) return;
      return this.moveByRoll(p,d1,d2,0);
    }
    const dcount=dbl?s.doubles+1:0;
    if(dcount>=3){
      this.emit({type:'DICE_ROLLED',player:p,d1,d2,from,to:from,path:[],doubles:0,passedGo:false});
      this.sendToJail(p); return this.finish(p);
    }
    return this.moveByRoll(p,d1,d2,dcount);
  }
  moveByRoll(p,d1,d2,doubles){
    const pl=this.state.players[p], from=pl.pos, total=d1+d2, path=[];
    for(let k=1;k<=total;k++) path.push((from+k)%NSP);
    const to=path[path.length-1], passed=from+total>=NSP;
    this.emit({type:'DICE_ROLLED',player:p,d1,d2,from,to,path,doubles,passedGo:passed});
    if(passed) this.emit({type:'PASSED_GO',player:p,amount:GO_BONUS});
    if(this.landing(p,to,0,total)==='done') this.finish(p);
  }
  sendToJail(p){
    const from=this.state.players[p].pos;
    this.emit({type:'MOVED',player:p,from,to:JAIL_POS,path:[JAIL_POS],glide:true,reason:'jail'});
    this.emit({type:'JAILED',player:p});
    return 'done';
  }
  rentFor(pos,total){
    const s=this.state, sp=BOARD[pos], owner=s.owners[pos];
    if(sp.type==='prop'){
      const full=GROUP_SPACES[sp.group].every(i=>s.owners[i]===owner), lv=s.builds[pos]||0;
      return sp.rent*(lv>0?RENT_MULT[lv]:full?2:1);
    }
    if(sp.type==='station'){ const n=STATIONS.filter(i=>s.owners[i]===owner).length; return 25*Math.pow(2,n-1); }
    const n=UTILITIES.filter(i=>s.owners[i]===owner).length;
    return (n>=2?10:4)*total;
  }
  charge(p,amount,creditor,kind,extra){
    const pl=this.state.players[p]; if(amount>pl.cash) this.raise(p,amount); const pay=Math.min(amount,pl.cash);
    if(kind==='rent') this.emit({type:'RENT',from:p,to:creditor,amount:pay,full:amount,pos:extra.pos});
    else if(kind==='tax') this.emit({type:'TAX',player:p,amount:pay,full:amount,pos:extra.pos,label:BOARD[extra.pos].name});
    else this.emit({type:'CASH',player:p,amount:-pay,reason:kind});
    if(pay<amount){ this.bankrupt(p,creditor); return false; }
    return true;
  }
  bankrupt(p,creditor){
    this.emit({type:'BANKRUPT',player:p,creditor:creditor==null?null:creditor});
    const alive=this.state.players.filter(x=>!x.out);
    if(alive.length===1) this.emit({type:'GAME_OVER',winner:alive[0].id});
    else this.nextTurn(p);
  }
  landing(p,pos,depth,total){
    const s=this.state, sp=BOARD[pos], pl=s.players[p];
    this.emit({type:'LANDED',player:p,pos});
    if(sp.type==='prop'||sp.type==='station'||sp.type==='utility'){
      const owner=s.owners[pos];
      if(owner===undefined){
        if(pl.cash>=sp.price){ this.emit({type:'OFFER',player:p,pos,price:sp.price}); return 'wait'; }
        this.emit({type:'NOTE',player:p,text:pl.name+' cannot afford '+sp.name+'.'}); this.startAuction(p,pos); return 'wait';
      }
      if(owner===p) return this.offerUpgrade(p,pos)?'wait':'done';
      if(s.mort[pos]){ this.emit({type:'NOTE',player:p,text:sp.name+' is mortgaged. No rent.'}); return 'done'; }
      if(!this.charge(p,this.rentFor(pos,total),owner,'rent',{pos})) return 'bankrupt';
      return this.afterRent(p,pos);
    }
    if(sp.type==='tax') return this.charge(p,sp.amount,null,'tax',{pos})?'done':'bankrupt';
    if(sp.type==='gojail') return this.sendToJail(p);
    if(sp.type==='chance'||sp.type==='chest') return this.drawCard(p,sp.type,depth,total);
    return 'done';
  }
  drawCard(p,deck,depth,total){
    if(depth>=1) return 'done';
    const list=CARDS[deck], card=list[Math.floor(this.rng()*list.length)];
    this.emit({type:'CARD',player:p,deck,text:card.text});
    if(card.keep){ this.emit({type:'JAILCARD',player:p,delta:1}); return 'done'; }
    if(card.cash>0){ this.emit({type:'CASH',player:p,amount:card.cash,reason:'card'}); return 'done'; }
    if(card.cash<0) return this.charge(p,-card.cash,null,'card')?'done':'bankrupt';
    if(card.jail) return this.sendToJail(p);
    const pl=this.state.players[p], from=pl.pos;
    if(card.moveTo!=null){
      const steps=(card.moveTo-from+NSP)%NSP, path=[];
      for(let k=1;k<=steps;k++) path.push((from+k)%NSP);
      this.emit({type:'MOVED',player:p,from,to:card.moveTo,path,reason:'card'});
      if(from+steps>=NSP) this.emit({type:'PASSED_GO',player:p,amount:GO_BONUS});
      return this.landing(p,card.moveTo,depth+1,total);
    }
    if(card.back){
      const path=[]; for(let k=1;k<=card.back;k++) path.push((from-k+NSP)%NSP);
      const to=path[path.length-1];
      this.emit({type:'MOVED',player:p,from,to,path,reason:'card'});
      return this.landing(p,to,depth+1,total);
    }
    return 'done';
  }
}

/* Applies events in order, drops duplicates, holds back out-of-order events until the gap fills. */
class EventBuffer {
  constructor(startSeq,onEvent){ this.next=startSeq+1; this.pending=new Map(); this.onEvent=onEvent; this.dups=0; }
  push(ev){
    if(ev.seq<this.next||this.pending.has(ev.seq)){ this.dups++; return; }
    this.pending.set(ev.seq,ev); this.flush();
  }
  flush(){ while(this.pending.has(this.next)){ const e=this.pending.get(this.next); this.pending.delete(this.next); this.next++; this.onEvent(e); } }
  hasGap(){ return this.pending.size>0; }
}

let NAMES=['A','B'], ME=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const easeSine=p=>-(Math.cos(Math.PI*p)-1)/2;
const easeOutCubic=p=>1-Math.pow(1-p,3);
const easeInOutCubic=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function h(tag,props){
  const e=document.createElement(tag);
  if(props) for(const k in props){ const v=props[k];
    if(k==='class') e.className=v; else if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,''); else if(v!==false&&v!=null) e.setAttribute(k,v); }
  for(let i=2;i<arguments.length;i++){ const kids=[].concat(arguments[i]); for(const c of kids) if(c!=null&&c!==false) e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
function gridPos(i){
  if(i<=10) return {col:10-i,row:10};
  if(i<=20) return {col:0,row:10-(i-10)};
  if(i<=30) return {col:i-20,row:0};
  return {col:10,row:i-30};
}
const cellCenter=i=>{ const g=gridPos(i); return {x:g.col*C+C/2,y:g.row*C+C/2}; };
const groupColor=sp=>sp.group?GROUPS[sp.group].color:'#6fd1c3';

/* ---------- Settings ---------- */

  latency:150, chaos:false, mode:'worth'

/* ---------- One animation system: a single ticker drives tweens, token positions and camera in the same frame ---------- */
const ticker={list:[],scale:1};
function tween(dur,update,ease){ return new Promise(res=>ticker.list.push({t:0,dur:Math.max(1,dur),update,ease:ease||(p=>p),res})); }
const sleep=ms=>tween(ms,null);
function stepTweens(dt){
  const l=ticker.list;
  for(let i=0;i<l.length;){
    const a=l[i]; a.t+=dt; const p=Math.min(1,a.t/a.dur);
    if(a.update) a.update(a.ease(p));
    if(p>=1){ l.splice(i,1); a.res(); } else i++;
  }
}
function waapi(el,frames,opts){
  if(settings.reducedMotion||!el.animate) return null;
  opts=Object.assign({},opts); opts.duration=(opts.duration||200)/ticker.scale; return el.animate(frames,opts);
}

/* ---------- Camera ---------- */
const cam={x:BW/2,y:BW/2,s:1,mode:'follow',focus:0,zoom:1,vx:0,vy:0,px:0,py:0,snap:true,base:1};
let stageW=360,stageH=500,lastTransform='';
function baseScale(){ return clamp(Math.min(stageW,stageH*1.15)/(C*4.6),.5,1.3); }
function fitScale(){ return Math.min(stageW,stageH)/(BW+C*.4); }
function camUpdate(dtMs){
  const dt=Math.max(dtMs,1)/1000, ks=Math.min(ticker.scale,3);
  cam.base=baseScale();
  if(cam.mode!=='free'){
    let tx=cam.x,ty=cam.y,ts=cam.s,k=4.6;
    if(cam.mode==='overview'){ tx=BW/2; ty=BW/2; ts=fitScale(); k=4; }
    else{
      const tk=tokens[cam.focus];
      if(tk){
        const a=1-Math.exp(-6*dt);
        cam.vx+=((tk.x-cam.px)/dt-cam.vx)*a; cam.vy+=((tk.y-cam.py)/dt-cam.vy)*a;
        cam.px=tk.x; cam.py=tk.y;
        const la=clamp(tk.remaining/3,0,1);                 /* lookahead fades as the token nears its destination */
        tx=tk.x+clamp(cam.vx*.3,-C*.9,C*.9)*la; ty=tk.y+clamp(cam.vy*.3,-C*.9,C*.9)*la;
        k=tk.remaining>2?4.6:2.7+tk.remaining*.95;           /* tracking slows over the last two spaces */
      }
      ts=cam.base*cam.zoom;
    }
    if(cam.snap||settings.reducedMotion&&!tokenBusy()){ cam.x=tx;cam.y=ty;cam.s=ts;cam.snap=false; }
    else{ const ak=1-Math.exp(-k*ks*dt); cam.x+=(tx-cam.x)*ak; cam.y+=(ty-cam.y)*ak; cam.s+=(ts-cam.s)*(1-Math.exp(-3.4*dt)); }
  }
  const pad=C*.7, hw=stageW/(2*cam.s), hh=stageH/(2*cam.s);
  cam.x=BW+2*pad<2*hw?BW/2:clamp(cam.x,hw-pad,BW-hw+pad);
  cam.y=BW+2*pad<2*hh?BW/2:clamp(cam.y,hh-pad,BW-hh+pad);
  const t='translate3d('+(stageW/2-cam.x*cam.s).toFixed(2)+'px,'+(stageH/2-cam.y*cam.s).toFixed(2)+'px,0) scale('+cam.s.toFixed(4)+')';
  if(t!==lastTransform){ worldEl.style.transform=t; lastTransform=t; }
}
function tokenBusy(){ return tokens.some(t=>t.remaining>0); }
function setCamMode(m){ cam.mode=m; $('#camMode').textContent=m==='overview'?'Follow':'Overview'; }

/* ---------- Tokens ---------- */
let tokens=[],worldEl,cellEls=[],chips=[];

  });

    worldEl.append(el);

function syncTokens(){ view.players.forEach((p,i)=>{ const c=cellCenter(p.pos), t=tokens[i]; t.x=c.x;t.y=c.y;t.hop=0;t.remaining=0; t.el.style.opacity=p.out?'.25':'1'; }); }
function renderTokens(){
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i], k=(t.x+SLOT[i][0]).toFixed(1)+','+(t.y+SLOT[i][1]).toFixed(1)+','+t.hop.toFixed(1);
    if(k===t.key) continue; t.key=k;
    t.el.style.transform='translate3d('+(t.x+SLOT[i][0]).toFixed(1)+'px,'+(t.y+SLOT[i][1]).toFixed(1)+'px,0)';
    t.inner.style.transform='translate3d(0,'+(-t.hop).toFixed(1)+'px,0)';
    t.sh.style.transform='scale('+(1-t.hop/40).toFixed(3)+')';
  }
}
function moveToken(pid,path,glide){
  const t=tokens[pid];
  if(cam.mode==='free') setCamMode('follow');
  if(settings.reducedMotion){
    const e=cellCenter(path[path.length-1]);
    return sleep(160).then(()=>{ t.x=e.x;t.y=e.y;t.hop=0;t.remaining=0;cam.snap=true; });
  }
  const pts=[{x:t.x,y:t.y}].concat(path.map(cellCenter));
  if(glide){
    const a=pts[0], b=pts[pts.length-1];
    return tween(780,p=>{ t.x=a.x+(b.x-a.x)*p; t.y=a.y+(b.y-a.y)*p; t.hop=Math.sin(Math.PI*p)*18; t.remaining=Math.max(0,(1-p)*3); },easeInOutCubic)
      .then(()=>{ t.hop=0; t.remaining=0; });
  }
  const n=pts.length-1, durs=[];
  for(let i=0;i<n;i++){ const left=n-1-i; durs.push(255*(left===0?1.9:left===1?1.45:left===2?1.15:1)); }
  const total=durs.reduce((a,b)=>a+b,0);
  return tween(total,p=>{
    let el=p*total, i=0; while(i<n-1&&el>durs[i]){ el-=durs[i]; i++; }
    const u=clamp(el/durs[i],0,1), e=.5*u+.5*easeSine(u);       /* gentle hop-to-hop pacing, never a full stop-start */
    const a=pts[i], b=pts[i+1];
    t.x=a.x+(b.x-a.x)*e; t.y=a.y+(b.y-a.y)*e; t.hop=Math.sin(Math.PI*u)*11; t.remaining=(n-1-i)+(1-u);
  }).then(()=>{ const f=pts[n]; t.x=f.x;t.y=f.y;t.hop=0;t.remaining=0; });
}

/* ---------- Dice ---------- */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function buildDice(){ for(const id of ['die0','die1']){ const d=$('#'+id); d.textContent=''; for(let i=0;i<9;i++) d.append(h('span',{class:'pip'})); } }
function setFace(id,v){ const pips=$('#'+id).children; for(let i=0;i<9;i++) pips[i].classList.toggle('on',PIPS[v].indexOf(i)>=0); }
async function diceRoll(ev){
  const box=$('#dice'); box.classList.add('show');
  $('#dsum').textContent='Rolling…';
  if(settings.reducedMotion){ setFace('die0',ev.d1); setFace('die1',ev.d2); await sleep(220); }
  else{
    const dur=700/ticker.scale; let n=0;
    const iv=setInterval(()=>{ setFace('die0',1+Math.floor(Math.random()*6)); setFace('die1',1+Math.floor(Math.random()*6)); n++; },75);
    ['die0','die1'].forEach((id,k)=>waapi($('#'+id),[
      {transform:'rotate(0) scale(.9)'},{transform:'rotate('+(300+k*60)+'deg) translateY(-12px) scale(1.15)',offset:.5},{transform:'rotate('+(720+k*90)+'deg) scale(1)'}],
      {duration:700,easing:'cubic-bezier(.3,.7,.3,1)'}));
    await sleep(700);
    clearInterval(iv); setFace('die0',ev.d1); setFace('die1',ev.d2);       /* authoritative result revealed */
  }
  $('#dsum').textContent=(ev.d1+ev.d2)+(ev.d1===ev.d2?' · doubles':'');
  box.setAttribute('aria-label','Rolled '+ev.d1+' and '+ev.d2);
  await sleep(320);
}

let logLines=[], bannerTok=0, cardTok=0;
function say(text){
  const b=$('#banner'); b.textContent=text; const tok=++bannerTok;

function showCard(cfg){
  const c=$('#card'); cardTok++;

  c.append(h('i',{class:'cband'}),h('div',null,h('div',{class:'ctitle',text:cfg.title}),h('div',{class:'cbody',text:cfg.body})));

function hideCard(){
  const c=$('#card'); if(c.hidden) return; const tok=++cardTok;

let server,net,buffer,truth,view,presenter,bots,actionLock=null,gapSince=0,timers=[],session=0,lastTap=0;

function ownerName(i){ const o=view.owners[i]; return o===undefined?'unowned':'owned by '+view.players[o].name; }
function describeCell(i){
  const sp=BOARD[i];
  if(sp.type==='prop') return sp.name+', '+GROUPS[sp.group].name+' set, '+money(sp.price)+', '+(view?ownerName(i):'unowned');
  if(sp.type==='station'||sp.type==='utility') return sp.name+', '+sp.type+', '+money(sp.price)+', '+(view?ownerName(i):'unowned');
  return sp.name;
}
function buildPlayers(){
  const box=$('#players'); box.textContent=''; chips=[];
  NAMES.forEach((n,i)=>{
    const cash=h('span',{class:'cash',text:money(START_CASH)}), delta=h('span',{class:'delta','aria-hidden':'true'}), tag=h('span',{class:'tag',text:'Turn'}), meta=h('span',{class:'meta'});
    const el=h('div',{class:'chip glass',style:'--pc:'+PCOL[i],role:'group'},
      h('span',{class:'av',text:n[0],'aria-hidden':'true'}), h('span',{class:'cm'},h('span',{class:'nm',text:n}),cash,meta), tag, delta);
    box.append(el); chips.push({el,cash,delta,tag,meta,disp:START_CASH,target:START_CASH,tid:0,active:false});

function syncCash(i){
  const c=chips[i], target=view.players[i].cash;
  if(c.target===target) return;
  const from=c.disp, diff=target-from, id=++c.tid; c.target=target;
  if(settings.reducedMotion||Math.abs(diff)<1){ c.disp=target; c.cash.textContent=money(target); }
  else tween(550,p=>{ if(c.tid!==id) return; c.disp=from+diff*p; c.cash.textContent=money(c.disp); },easeOutCubic)
    .then(()=>{ if(c.tid===id){ c.disp=target; c.cash.textContent=money(target); } });
  const d=c.delta; d.textContent=(diff>0?'+':'−')+money(Math.abs(diff)); d.className='delta '+(diff>0?'up':'down');
  if(!waapi(d,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(-2px)',offset:.2},{opacity:1,transform:'translateY(-8px)',offset:.7},{opacity:0,transform:'translateY(-14px)'}],{duration:1100,easing:'ease-out'})){
    d.style.opacity='1'; setTimeout(()=>{ d.style.opacity='0'; },1100);
  }
}

function synced(){ return !presenter.busy&&presenter.queue.length===0&&view.seq===truth.seq; }
function currentAction(){
  if(!synced()||truth.winner!=null||truth.players[ME].out) return null;
  if(truth.phase==='auction'){ const A=truth.auction; if(!A||A.cur!==ME) return null; const nb=A.bid+A.inc; return {type:'BID',amount:nb,label:'Bid · '+money(nb),alt:{type:'PASS_BID',label:'Drop out'}}; }
  if(truth.phase==='vote'){ if(!truth.vote||truth.vote.votes[ME]!==undefined) return null; return {type:'VOTE',choice:'end',label:'Vote: end game',alt:{type:'VOTE',choice:'continue',label:'Play on'}}; }
  if(truth.turn!==ME) return null;

  if(truth.phase==='upgrade') return {type:'UPGRADE',label:'Upgrade · '+money(truth.offer.price),alt:{type:'SKIP',label:'Skip'}};
  if(truth.phase==='takeover') return {type:'TAKEOVER',label:'Take over · '+money(truth.offer.price),alt:{type:'SKIP',label:'Skip'}};
  if(truth.phase==='offer') return {type:'BUY',label:'Buy · '+money(truth.offer.price),alt:{type:'DECLINE',label:'Pass'}};
  if(truth.phase==='end') return {type:'END_TURN',label:'End turn'};

}

    else if(act.type==='BID'){ const A=truth.auction; title='Auction · '+BOARD[A.pos].name; sub=(A.bidder!=null?'High bid '+money(A.bid)+' by '+nm(A.bidder):'No bids yet')+' · you have '+money(me.cash); slabel=act.alt.label; senable=!actionLock; }

/* ---------- Presenter: plays confirmed events one at a time; never decides outcomes ---------- */
class Presenter{
  constructor(){ this.queue=[]; this.busy=false; this.activity=''; this.skip=false; }
  push(ev){ this.queue.push(ev); renderDock(); if(!this.busy) this.run(); }
  async run(){
    this.busy=true; const mine=session;
    while(this.queue.length){
      if(this.queue.length>24){ for(const e of this.queue) reduce(view,e); this.queue.length=0; syncTokens(); renderAll(); hideCard(); break; }  /* long gap: snap to confirmed state */
      const n=this.queue.length;
      ticker.scale=this.skip?10:n>10?4:n>5?2.2:n>3?1.5:1;
      const ev=this.queue.shift();
      try{ await play(ev); }catch(err){ console.error(err); reduce(view,ev); renderAll(); }
      if(mine!==session) return;
    }
    this.busy=false; this.activity=''; this.skip=false; ticker.scale=1; renderDock();
  }
}
const nm=i=>i===ME?'You':view.players[i].name;
const be=i=>i===ME?'are':'is';
const s3=(i,a,b)=>i===ME?b:a;
function markHot(pos){
  cellEls.forEach(c=>c.classList.remove('hot')); const c=cellEls[pos]; c.classList.add('hot'); c.offsetWidth;
}
function focusCam(pid){ cam.focus=pid; cam.px=tokens[pid].x; cam.py=tokens[pid].y; cam.vx=cam.vy=0; if(cam.mode==='free') setCamMode('follow'); }
async function play(ev){
  const who=ev.player!==undefined?nm(ev.player):'';
  switch(ev.type){
    case 'TURN_START':
      reduce(view,ev); hideCard(); cellEls.forEach(c=>c.classList.remove('hot')); $('#dice').classList.remove('show');
      presenter.activity=(ev.player===ME?'Your':who+'’s')+' turn'; renderAll(); focusCam(ev.player);
      say(ev.player===ME?'Your turn':who+'’s turn'); await sleep(650); break;
    case 'DICE_ROLLED':
      presenter.activity=who+' '+be(ev.player)+' rolling'; renderDock(); focusCam(ev.player); $('#dice').classList.add('show');
      await diceRoll(ev);
      say(who+' rolled '+(ev.d1+ev.d2)+(ev.d1===ev.d2?' (doubles)':''));
      if(ev.path.length){ presenter.activity=who+' '+be(ev.player)+' moving'; renderDock(); await moveToken(ev.player,ev.path,false); }
      reduce(view,ev); renderAll(); await sleep(120); break;
    case 'MOVED':
      presenter.activity=who+' '+be(ev.player)+' moving'; renderDock(); focusCam(ev.player);
      if(ev.reason==='jail') say(who+' '+be(ev.player)+' sent to Detention');
      await moveToken(ev.player,ev.path,!!ev.glide); reduce(view,ev); renderAll(); await sleep(160); break;
    case 'PASSED_GO': reduce(view,ev); renderAll(); say(who+' passed Start · +'+money(ev.amount)); await sleep(550); break;
    case 'LANDED': markHot(ev.pos); say(who+' landed on '+BOARD[ev.pos].name); await sleep(380); break;
    case 'OFFER':{
      reduce(view,ev); const sp=BOARD[ev.pos]; presenter.activity=who+' '+be(ev.player)+' deciding';
      showCard({title:sp.name,color:groupColor(sp),body:(sp.group?GROUPS[sp.group].name+' set · ':sp.type==='station'?'Station · ':'Utility · ')+money(ev.price)+(ev.player===ME?'. Buy it or pass.':'. '+who+' is deciding.')});
      renderAll(); await sleep(ev.player===ME?200:900); break; }
    case 'BOUGHT':{
      reduce(view,ev); hideCard(); renderAll(); say(who+' bought '+BOARD[ev.pos].name+' for '+money(ev.price)); await sleep(700); break; }
    case 'DECLINED': reduce(view,ev); hideCard(); renderAll(); say(who+' passed on '+BOARD[ev.pos].name); await sleep(450); break;
    case 'RENT':{
      const sp=BOARD[ev.pos]; reduce(view,ev); renderAll();
      showCard({title:'Rent · '+money(ev.amount),color:groupColor(sp),body:nm(ev.from)+' '+s3(ev.from,'pays','pay')+' '+nm(ev.to)+' for '+sp.name+(ev.full>ev.amount?' (could not cover '+money(ev.full)+')':'.')});
      say(nm(ev.from)+' paid '+money(ev.amount)+' rent to '+nm(ev.to)); await sleep(1250); hideCard(); break; }
    case 'TAX':{
      reduce(view,ev); renderAll(); showCard({title:ev.label||BOARD[ev.pos].name,body:nm(ev.player)+' '+s3(ev.player,'pays','pay')+' '+money(ev.amount)+'.'});
      say(nm(ev.player)+' paid '+money(ev.amount)+' in tax'); await sleep(1150); hideCard(); break; }
    case 'CARD':
      showCard({title:ev.deck==='chance'?'Chance':'Community Chest',body:ev.text,color:'#6fd1c3'}); say(who+' drew a card'); await sleep(1500); hideCard(); break;
    case 'CASH': reduce(view,ev); renderAll(); say(who+(ev.amount>0?' collected ':' paid ')+money(Math.abs(ev.amount))); await sleep(600); break;
    case 'JAILED': reduce(view,ev); renderAll(); await sleep(350); break;
    case 'FREED': reduce(view,ev); renderAll(); say(who+' '+s3(ev.player,'leaves','leave')+' Detention'); await sleep(450); break;
    case 'JAIL_FAIL': reduce(view,ev); renderAll(); say(who+' '+s3(ev.player,'stays','stay')+' in Detention ('+ev.left+' left)'); await sleep(500); break;
    case 'NOTE': say(ev.text); await sleep(600); break;
    case 'BANKRUPT':{
      const cr=ev.creditor==null?'return to the bank':'go to '+nm(ev.creditor);
      showCard({title:nm(ev.player)+' '+be(ev.player)+' bankrupt',danger:true,body:'Debts exceed cash. Their properties '+cr+'.'});
      reduce(view,ev); renderAll(); say(nm(ev.player)+' '+be(ev.player)+' bankrupt'); await sleep(1700); hideCard(); break; }
    case 'GAME_OVER': reduce(view,ev); renderAll(); showVictory(); await sleep(300); break;
    default: reduce(view,ev); renderAll(); if(ev.text) say(ev.text); await sleep(ev.text?750:0);
  }
}

  $('#mSub').textContent=view.endReason!=='last'?'Highest net worth when the vote ended the game.':(w===ME?'The harbor is yours.':'The last player standing takes the harbor.');

/* ---------- Simulated network and remote players ---------- */
class Net{
  constructor(server,onEvent){ this.server=server; this.online=true; this.dead=false; this.syncing=false; this.onEvent=onEvent; this.waiting=[]; this.lastAt=0; server.subscribe(ev=>this.fromServer(ev)); }
  lat(){ const b=settings.latency; return b?b*(.7+Math.random()*.6):0; }
  later(fn,ms){ if(ms<=0) Promise.resolve().then(fn); else setTimeout(fn,ms); }
  deliver(ev,ms){ this.later(()=>{ if(!this.dead&&this.online) this.onEvent(JSON.parse(JSON.stringify(ev))); },ms); }
  fromServer(ev){
    if(this.dead||!this.online) return;
    let at=this.lat();
    if(settings.chaos){ if(Math.random()<.35) at+=Math.random()*700; if(Math.random()<.15) this.deliver(ev,at+Math.random()*400); }
    else{ const now=performance.now(); at=Math.max(at,this.lastAt-now+1); this.lastAt=now+at; }   /* ordered like a websocket unless chaos is on */
    this.deliver(ev,at);
  }
  send(action){
    action.id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    return new Promise(resolve=>{
      let done=false;
      const attempt=()=>{
        if(done||this.dead) return;
        if(!this.online){ this.waiting.push(attempt); return; }
        this.later(()=>{ const ack=this.server.submit(action); this.later(()=>{ if(this.online&&!done){ done=true; resolve(ack); } },this.lat()); },this.lat());
      };
      attempt();
      const retry=()=>{ if(done||this.dead) return; attempt(); setTimeout(retry,3500); };
      setTimeout(retry,3500);
    });
  }
  resync(){
    if(this.syncing||this.dead) return; this.syncing=true; renderNet();
    this.later(()=>{
      if(!this.online){ this.syncing=false; renderNet(); return; }
      this.server.eventsSince(buffer.next-1).forEach(e=>this.onEvent(e));
      this.syncing=false; renderNet();
    },this.lat()+120);
  }
  ping(){ this.later(()=>{ if(this.online&&this.server.state.seq>buffer.next-1) this.resync(); },this.lat()); }
  disconnect(ms){
    if(!this.online) return; this.online=false; renderNet(); renderDock();
    setTimeout(()=>{ if(this.dead) return; this.online=true; const w=this.waiting; this.waiting=[]; w.forEach(f=>f()); this.resync(); renderNet(); renderDock(); },ms);
  }
}
class Bots{
  constructor(server,ids){ this.server=server; this.ids=ids; this.timer=0; this.budget=0; this.dead=false; server.subscribe(ev=>{ this.budget+=presentMs(ev); clearTimeout(this.timer); this.timer=setTimeout(()=>this.think(),clamp(this.budget*.8+600,900,6000)); }); }
  manage(s,p){
    const pl=s.players[p], mine=ownedBy(s,p);
    for(const i of mine) if(s.mort[i]&&pl.cash>redeemCost(s,i)+300) return {type:'REDEEM',pos:i};
    return null;
  }
  think(){
    if(this.dead) return; this.budget=0;
    const s=this.server.state; if(s.winner!=null) return;
    const p=(s.phase==='auction'&&s.auction)?s.auction.cur:s.turn; if(p==null||this.ids.indexOf(p)<0) return;
    const pl=s.players[p]; let a;
    if(s.phase==='auction'){ const A=s.auction, nb=A.bid+A.inc, val=BOARD[A.pos].price*(0.75+((p*37+A.pos*11)%5)*0.08);
      a=(nb<=val&&nb<=pl.cash-100)?{type:'BID',amount:nb}:{type:'PASS_BID'}; }
    else if(s.phase==='roll'){
      if(pl.jail&&s.jailCards[p]) a={type:'JAIL_CARD'}; else if(pl.jail&&pl.cash>600) a={type:'JAIL_PAY'};
      else if(pl.cash<100&&!this.server.validate({type:'AID',player:p})) a={type:'AID'}; else a={type:'ROLL'}; }
    else if(s.phase==='offer') a={type:s.players[p].cash-s.offer.price>=150?'BUY':'DECLINE'};

}
function leaveRoom(msg){
  if(ROOM.ch){ try{ ROOM.ch.unsubscribe(); }catch(e){} } ROOM.ch=null; store.removeItem('tw_room');
  $('#lbEnter').hidden=false; $('#lbRoom').hidden=true; lbMsg(msg);
}
function enterRoom(code,host,name){
  ROOM.host=host; ROOM.code=code; ROOM.name=name; ROOM.at=Date.now(); lbMsg('Connecting…');
  if(!host) store.setItem('tw_room',code);
  ROOM.sb=ROOM.sb||supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const ch=ROOM.sb.channel('tidewater-'+code,{config:{presence:{key:ROOM.pid},broadcast:{self:false}}}); ROOM.ch=ch;
  ch.on('broadcast',{event:'m'},p=>onRoomMsg(p.payload));
  ch.on('presence',{event:'sync'},lobbyRender);
  ch.on('presence',{event:'join'},p=>onJoin(p.key));
  ch.on('presence',{event:'leave'},p=>onLeave(p.key));
  ch.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      await ch.track({name,host,at:ROOM.at,started:false}); lbMsg('');
      if(net&&ROOM.started){ net.online=true; renderNet(); renderDock(); if(!host) net.resync(); }
      if(!host&&!ROOM.started) setTimeout(()=>{ if(ROOM.ch===ch&&!ROOM.started&&!roomPlayers().some(p=>p.host)) leaveRoom('Room not found. Check the code and try again.'); },3500);
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
      if(net&&ROOM.started){ net.online=false; renderNet(); renderDock(); } else lbMsg('Connection problem. Retrying…');
    }
  });
}
function initLobby(){
  try{ ROOM.pid=store.getItem('tw_pid'); }catch(e){} if(!ROOM.pid){ ROOM.pid=uid(); store.setItem('tw_pid',ROOM.pid); }
  const nameEl=$('#lbName'); try{ nameEl.value=localStorage.getItem('tw_name')||''; }catch(e){}
  const ok=window.supabase&&!/PASTE/.test(SUPABASE_URL+SUPABASE_ANON_KEY);
  if(!ok) lbMsg('Supabase is not set up yet. Fill SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script.');
  const nm0=()=>{ const n=nameEl.value.trim()||'Player'; try{ localStorage.setItem('tw_name',n); }catch(e){} return n; };
  const alpha='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  $('#lbCreate').onclick=()=>{ if(!ok) return; let c=''; const r=new Uint32Array(5); (window.crypto||{getRandomValues:a=>a.forEach((_,i)=>{a[i]=Math.random()*4e9;})}).getRandomValues(r); r.forEach(x=>{ c+=alpha[x%alpha.length]; }); enterRoom(c,true,nm0()); };
  const join=()=>{ if(!ok) return; const c=$('#lbCode').value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(c.length!==5){ lbMsg('Enter the 5-character room code.'); return; } enterRoom(c,false,nm0()); };
  $('#lbJoin').onclick=join; $('#lbCode').addEventListener('keydown',e=>{ if(e.key==='Enter') join(); });
  $('#lbCopy').onclick=()=>{ const u=location.origin+location.pathname+'?room='+ROOM.code; if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>lbMsg('Invite link copied.'),()=>lbMsg(u)); else lbMsg(u); };
  $('#lbStart').onclick=()=>{
    const ps=roomPlayers().slice(0,4); if(ps.length<2) return; const used={};
    const seats=ps.map(p=>{ let n=p.name||'Player'; if(used[n]) n+=' '+(++used[n]); else used[n]=1; return {pid:p.pid,name:n}; });
    ROOM.ch.track({name:ROOM.name,host:true,at:ROOM.at,started:true,seats}); ROOM.send({t:'start',seats}); beginGame(seats);
  };
  const q=new URLSearchParams(location.search).get('room'); if(q) $('#lbCode').value=q.toUpperCase().slice(0,5);
  const saved=store.getItem('tw_room'); if(ok&&saved&&!q) enterRoom(saved,false,nm0());
}
/* ---------- Wiring ---------- */
function onPrimary(){
  const now=performance.now(); if(now-lastTap<400) return; lastTap=now;       /* ignore accidental double taps */
  if(truth.winner!=null&&synced()){ hostRestart(); return; }
  const a=currentAction(); if(!a||actionLock) return;
  sendAction(a);
}
function onSecondary(){
  const now=performance.now(); if(now-lastTap<400) return; lastTap=now;
  const a=currentAction();
  if(a&&a.alt&&!actionLock) sendAction(a.alt);
  else if(presenter.busy){ presenter.skip=true; ticker.scale=10; }
}
function sendAction(act){
  actionLock={seq:truth.seq,at:performance.now()}; renderDock();
  const s=session;
  net.send(Object.assign({},act,{player:ME})).then(ack=>{
    if(s!==session) return;
    if(!ack.ok){ actionLock=null; say(ack.error); renderDock(); net.resync(); }
  });
}
document.addEventListener('DOMContentLoaded',()=>{
  stageInit();
  $('#btnPrimary').onclick=onPrimary; $('#btnSecondary').onclick=onSecondary;
  document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>({assets:openAssets,deals:openDeals,log:openLog,menu:openMenu})[b.dataset.sheet]());
  $('#sheetClose').onclick=closeSheet; $('#scrim').onclick=closeSheet;
  $('#sheetBack').onclick=()=>{ if(sheetBackFn) sheetBackFn(); };
  $('#mAgain').onclick=()=>hostRestart();
  $('#tmYes').onclick=()=>sendAction({type:'TRADE_REPLY',accept:true}); $('#tmNo').onclick=()=>sendAction({type:'TRADE_REPLY',accept:false});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&sheetOpen) closeSheet();
    else if((e.key==='r'||e.key==='R')&&!sheetOpen&&!e.metaKey&&!e.ctrlKey&&!e.target.closest('input,select,textarea')){ const p=$('#btnPrimary'); if(!p.disabled) p.click(); }
  });
  /* drag the sheet handle down to dismiss */
  const grab=$('#grab'); let gy=null;
  grab.addEventListener('pointerdown',e=>{ gy=e.clientY; grab.setPointerCapture(e.pointerId); $('#sheet').classList.add('drag'); });
  grab.addEventListener('pointermove',e=>{ if(gy!=null) $('#sheet').style.transform='translateY('+Math.max(0,e.clientY-gy)+'px)'; });
  const gend=e=>{ if(gy==null) return; const dy=e.clientY-gy; gy=null; $('#sheet').classList.remove('drag'); if(dy>90) closeSheet(); else $('#sheet').style.transform=''; };
  grab.addEventListener('pointerup',gend); grab.addEventListener('pointercancel',gend);
  /* main loop */
  let last=0, ema=16, slow=0;
  function frame(now){
    requestAnimationFrame(frame);
    const raw=last?now-last:16; last=now; const dt=Math.min(raw,50);
    stepTweens(dt*ticker.scale); camUpdate(dt); renderTokens();
    if(ticker.list.length&&!document.hidden){
      ema+=(raw-ema)*.05;
      if(ema>34&&!settings.lite){ if(++slow>150){ settings.lite=true; applySettings(); say('Reduced effects turned on to keep things smooth.'); } } else slow=Math.max(0,slow-1);
    }
  }
  idleBoard(); initLobby();       /* build the board first, then start the frame loop */
  requestAnimationFrame(frame);
});
window.__tidewater={get truth(){return truth},get view(){return view},get presenter(){return presenter},get buffer(){return buffer},get server(){return server},get net(){return net},cam,settings};
